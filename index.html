const DATA={"updated":"2026-11-03","sources":[{"id":"types","title":"Power Automate와 흐름 종류","url":"https://learn.microsoft.com/en-us/power-automate/flow-types","topic":"기초 개념"},{"id":"triggers","title":"트리거 소개와 수동 실행","url":"https://learn.microsoft.com/ko-kr/power-automate/triggers-introduction","topic":"기초 개념"},{"id":"cloud","title":"클라우드 흐름 개요","url":"https://learn.microsoft.com/en-us/power-automate/overview-cloud","topic":"클라우드"},{"id":"outlook","title":"Office 365 Outlook 커넥터","url":"https://learn.microsoft.com/ko-kr/connectors/office365/","topic":"Outlook"},{"id":"teams","title":"Teams 커넥터와 사용 제한","url":"https://learn.microsoft.com/en-us/connectors/teams/","topic":"Teams"},{"id":"teamshow","title":"Teams에 메시지 보내기","url":"https://learn.microsoft.com/ko-kr/power-automate/teams/send-a-message-in-teams","topic":"Teams"},{"id":"sharepoint","title":"SharePoint 커넥터와 파일 만들기","url":"https://learn.microsoft.com/ko-kr/connectors/sharepointonline/","topic":"SharePoint"},{"id":"attach","title":"메일 첨부를 SharePoint에 저장하기","url":"https://learn.microsoft.com/ko-kr/training/modules/email-power-automate/5-save-sharepoint","topic":"SharePoint"},{"id":"excel","title":"Excel Online (Business) 커넥터","url":"https://learn.microsoft.com/ko-kr/connectors/excelonlinebusiness/","topic":"Excel"},{"id":"desktop","title":"데스크톱 흐름 소개","url":"https://learn.microsoft.com/en-us/power-automate/desktop-flows/introduction","topic":"데스크톱"},{"id":"files","title":"데스크톱 파일 작업: 복사·조회","url":"https://learn.microsoft.com/ko-kr/power-automate/desktop-flows/actions-reference/file","topic":"데스크톱"},{"id":"requirements","title":"데스크톱 설치 전 요구사항","url":"https://learn.microsoft.com/en-us/power-automate/desktop-flows/requirements","topic":"계정·환경"},{"id":"license","title":"Power Automate 라이선스 유형","url":"https://learn.microsoft.com/en-us/power-platform/admin/power-automate-licensing/types","topic":"라이선스"},{"id":"licensefaq","title":"Power Automate 라이선스 FAQ","url":"https://learn.microsoft.com/en-us/power-platform/admin/power-automate-licensing/faqs","topic":"라이선스"}],"lessons":[{"id":"start","n":"01","title":"자동화, 어디서부터 시작할까요?","subtitle":"반복되는 일을 규칙으로 설명하는 것부터 시작합니다.","tag":"기초 개념","icon":"spark","time":"7분","part":"basic","goal":"자동화에 적합한 업무와 클라우드·데스크톱의 차이를 설명할 수 있어요.","prepare":["특별한 프로그램 없이 이 페이지를 읽어도 됩니다.","내가 반복하는 업무 한 가지를 떠올려 보세요."],"concepts":[["클라우드 흐름","메일이 도착하거나 정해진 시간이 되면, 서비스의 연결 기능인 커넥터를 통해 작업해요. 예: Outlook 메일 → Teams 알림."],["데스크톱 흐름","내 PC에서 파일이나 프로그램을 다루는 작업을 자동화해요. 예: 연습 폴더의 파일 복사. PC 실행 환경의 영향을 받아요."],["트리거","흐름을 시작하는 사건이에요. 새 메일 도착, 버튼 클릭, 매일 오전 9시처럼 ‘언제?’에 해당해요."],["액션","시작 뒤에 할 일이에요. 메일 보내기, 파일 만들기, 메시지 게시처럼 ‘무엇을?’에 해당해요."]],"steps":[["업무를 한 문장으로 바꿔 보세요","“매일 반복해서 한다”만으로는 부족해요. \u003cstrong>언제 → 어떤 조건이면 → 무엇을 한다\u003c/strong>로 적어 보세요. 예: 교육용 메일이 도착하면 → 제목에 [자동화실습]이 있으면 → 교육용 Teams 채널에 알린다."],["좋은 첫 자동화를 고르세요","규칙이 명확하고, 입력 형태가 일정하고, 잘못 실행되어도 복구가 쉬운 일을 고르세요. 승인·결제·삭제·대량 외부 발송은 첫 실습에서 제외합니다."],["알맞은 도구를 선택하세요","Microsoft 365 서비스 사이의 작업이라면 클라우드 연결을 먼저 검토해요. 로컬 프로그램·파일을 조작해야 하면 데스크톱 흐름을 검토합니다. 연결 가능한 서비스까지 무조건 화면 클릭으로 자동화할 필요는 없어요."],["이번 수업의 성공 기준을 확인하세요","모든 기능을 외우는 수업이 아니에요. 본인에게 테스트 메일을 보내고, 교육용 메일에서 알림이 생기는 원리를 이해하면 첫 목표 달성이에요."]],"checks":["트리거와 액션의 차이를 말할 수 있다.","클라우드와 데스크톱 자동화의 차이를 이해했다.","안전하게 연습할 업무 하나를 골랐다."],"errors":[["AI가 알아서 모든 업무를 판단하나요?","이번 수업의 자동화는 미리 정한 규칙을 따릅니다. 생성형 AI 기능은 기초 범위에 넣지 않습니다."],["화면을 항상 켜 둬야 하나요?","클라우드 흐름과 PC를 사용하는 데스크톱 흐름의 실행 조건은 다릅니다. PC 자동화의 무인 실행은 별도 환경·라이선스를 확인하세요."]],"sources":["types","cloud","desktop"],"tip":"강사: “메일을 확인하고 다시 Teams에 알려 준 적 있나요?”처럼 익숙한 반복 업무부터 질문하세요."},{"id":"prepare","n":"02","title":"실습 전, 안전하게 준비하기","subtitle":"계정이 있다고 모든 자동화를 사용할 수 있는 것은 아닙니다.","tag":"준비 체크","icon":"shield","time":"3분","part":"basic","goal":"실습에 필요한 권한과 교육용 공간을 확인할 수 있어요.","prepare":["회사 Microsoft 365 계정과 브라우저","강사가 승인받은 교육용 Teams 표준 채널 또는 본인 테스트 방식"],"steps":[["Power Automate에 접속하세요","\u003ca class=\"neutral-link\" href=\"https://make.powerautomate.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Power Automate 포털\u003c/a>에 회사 계정으로 접속합니다. 회사에서 허용한 환경을 사용하세요. 접근이 안 되거나 환경을 선택할 수 없으면 관리자 확인이 필요합니다. 새 환경·유료 체험을 임의로 만들 필요는 없어요."],["연결과 사용 권한을 확인하세요","Office 365 Outlook 연결을 만들 수 있는지 확인하세요. 이번 예제의 Outlook·Teams·SharePoint·Excel Online (Business)는 표준 커넥터지만, 조직 데이터 정책·조건부 액세스·라이선스·서비스 권한에 따라 제한될 수 있어요. 회사 정책을 우회하지 않습니다."],["테스트 공간을 분리하세요","Teams는 승인된 \u003cstrong>표준 교육용 채널\u003c/strong>, SharePoint는 테스트 폴더, 메일은 본인 계정을 사용하세요. 실제 고객·인사·급여·계약 자료는 넣지 마세요. 제목은 [자동화실습]으로 통일합니다."],["강사와 수강생의 차이를 확인하세요","강사 계정만 되는지 확인하는 것으로 끝내지 마세요. 일반 수강생 권한 계정에서 연결·게시·업로드를 미리 확인합니다. Teams Workflows 앱 허용과 해당 채널 게시 권한도 점검하세요."],["실습 종료 방법도 정하세요","만든 흐름은 이름 앞에 EDU_를 붙입니다. 교육이 끝나면 흐름을 끄고 예약 실행이 남지 않았는지 확인하세요. 테스트 게시물과 파일의 정리도 승인된 범위에서만 합니다."]],"checks":["실습 계정에서 포털과 Outlook 연결에 접근할 수 있다.","Teams 테스트 채널 또는 메일 대체 실습 방식을 정했다.","실제 업무자료를 사용하지 않기로 했다."],"errors":[["프리미엄 체험을 시작하라는 화면이 보여요.","이번 기초 실습에 꼭 필요한 기능인지 먼저 확인하세요. 프리미엄·AI Builder·무인 실행은 기본 실습에서 제외하며, 결제나 체험 등록을 유도하지 않습니다."],["조직에서 연결을 차단했어요.","다른 계정으로 우회하지 마세요. 관리자에게 커넥터 이름과 오류 화면을 전달하고, 사이트 내 가상 연습으로 전환하세요."]],"sources":["license","licensefaq","teams","requirements"],"tip":"강사: 준비가 막힌 참가자는 사이트의 가상 연습으로 따라오도록 안내하세요. 그 자리에서 조직 정책을 바꾸지 않습니다."},{"id":"first-mail","n":"03","title":"버튼 한 번으로 나에게 메일 보내기","subtitle":"처음 만드는 흐름은 작고 확실하게, 수신자는 본인만.","tag":"첫 실습","icon":"mail","time":"10분","part":"cloud","goal":"수동 실행 흐름을 만들고 실제 결과와 실행 기록을 확인할 수 있어요.","prepare":["Office 365 Outlook 연결 가능 여부 확인","본인 회사 메일 주소 확인. 이 사이트에는 주소를 입력하지 않습니다."],"steps":[["인스턴트 클라우드 흐름을 만드세요","포털에서 만들기 → 인스턴트 클라우드 흐름을 선택합니다. 이름은 \u003ccode>EDU_01_나에게메일\u003c/code>. 트리거는 \u003cstrong>Manually trigger a flow\u003c/strong>(수동으로 흐름 트리거)를 선택하세요. 디자이너에 따라 메뉴 위치·한국어 번역은 달라질 수 있어요."],["Office 365 Outlook 액션을 추가하세요","새 단계/작업 추가에서 \u003cstrong>Office 365 Outlook\u003c/strong>을 검색하고 \u003cstrong>Send an email (V2)\u003c/strong>(전자 메일 보내기 V2)를 선택합니다. Outlook.com이나 Deprecated(사용 중단) 액션을 선택하지 않도록 주의하세요."],["세 칸만 채우세요","받는 사람(To)은 \u003cstrong>본인 회사 주소\u003c/strong>, 제목(Subject)은 \u003ccode>[자동화실습] 첫 번째 메일\u003c/code>, 본문(Body)은 “이 메일은 교육용 테스트입니다.”로 입력하세요. From·참조·숨은 참조·첨부는 비워 둡니다."],["저장하고 수동으로 테스트하세요","저장 후 테스트/실행에서 수동 실행을 선택합니다. 저장은 설계도를 보관하는 것이고, 실행은 실제 메일을 보내는 것이에요. 실행 버튼을 여러 번 누르면 여러 통 발송될 수 있습니다."],["결과를 두 군데에서 확인하세요","흐름의 실행 기록에서 트리거와 메일 액션이 성공했는지 확인하고, 본인 받은편지함에서 해당 테스트 메일을 찾으세요. 필요하면 스팸/정크 폴더도 확인합니다."],["흐름을 끄고 실습을 마치세요","테스트가 끝났으면 흐름 목록/상세 화면에서 해당 흐름을 끕니다. 본인이 만든 EDU_ 흐름만 다루세요."]],"checks":["수신자가 본인 한 명인지 실행 전에 확인했다.","실행 기록에서 메일 액션의 성공을 확인했다.","본인 받은편지함에서 테스트 메일을 확인했다."],"errors":[["저장했는데 메일이 오지 않아요.","수동 실행 흐름은 저장만 해서는 보내지 않습니다. 한 번 실행한 뒤 실행 기록을 확인하세요."],["보낸 사람 권한 오류가 나요.","From을 지정했다면 비워 두세요. 다른 사서함으로 보내려면 별도 Send As/Send on behalf 권한이 필요할 수 있습니다."],["메일이 여러 통 도착했어요.","실행 횟수를 확인하세요. 중복 클릭이나 반복 테스트는 각각 실제 발송입니다."]],"sources":["triggers","outlook"],"tip":"강사: “저장과 실행은 다릅니다”를 강조하고, 모두가 본인 수신자를 확인한 뒤 함께 한 번만 실행하세요."},{"id":"mail-teams","n":"04","title":"교육용 메일이 오면 Teams에 알리기","subtitle":"트리거와 액션을 연결하는 오늘의 핵심 실습입니다.","tag":"핵심 실습","icon":"teams","time":"20분","part":"cloud","goal":"새 메일을 조건으로 받아 지정한 교육용 Teams 채널에 알릴 수 있어요.","prepare":["승인된 Teams 표준 테스트 채널과 게시 권한","Teams Workflows 앱 사용 허용 여부 확인","막히면 본인에게 메일 보내기로 대체하되 출력 제목은 [교육결과] 알림 확인으로 고정하여 재귀 발송 방지"],"steps":[["자동화된 클라우드 흐름을 만드세요","이름은 \u003ccode>EDU_02_메일알림\u003c/code>. Office 365 Outlook의 \u003cstrong>When a new email arrives (V3)\u003c/strong>(새 전자 메일이 도착하는 경우 V3)를 트리거로 고릅니다. 이전 실습의 수동 트리거와 다릅니다."],["받을 메일의 범위를 좁히세요","Folder는 실제 메일이 들어오는 받은편지함(Inbox)을 선택하고 Subject Filter는 \u003ccode>[자동화실습]\u003c/code>으로 설정합니다. 필요하면 From도 본인 주소로 제한하세요. 제목을 제한하지 않으면 일반 업무메일까지 처리할 수 있어요."],["Teams 메시지 액션을 추가하세요","Microsoft Teams의 \u003cstrong>Post message in a chat or channel\u003c/strong>(채팅 또는 채널에 메시지 게시)를 선택합니다. Post as는 Flow bot, Post in은 Channel로 설정하고 교육용 Team과 Channel을 선택하세요. \u003cstrong>이 액션의 비공개 채널 게시는 지원되지 않으므로 표준 테스트 채널을 사용합니다.\u003c/strong>"],["메시지에 필요한 정보만 넣으세요","“교육용 메일이 도착했습니다.”라는 안내 아래 트리거의 Subject(제목)와 From(보낸 사람) 동적 콘텐츠를 넣습니다. Subject라는 단어를 직접 쓰는 것이 아니라 이전 단계의 값을 선택하는 거예요. 메일 본문 전체와 첨부는 게시하지 않습니다."],["저장한 뒤 새 메일로 시험하세요","저장하고 흐름이 켜졌는지 확인한 후, 본인에게 \u003ccode>[자동화실습] 자료 확인 요청\u003c/code>이라는 새 메일을 한 통 보냅니다. 이미 도착한 옛 메일은 새 메일 트리거 시험용이 아니에요. 트리거 처리에 지연이 있을 수 있습니다."],["Teams와 실행 기록을 확인하세요","지정한 교육용 채널에서 제목·보낸 사람이 표시되는지 확인합니다. 실행 기록에서 트리거와 Teams 액션의 결과도 확인하세요. 다른 제목의 새 메일로 시험하면 필터 때문에 새 실행 자체가 생기지 않을 수 있어요."],["끝나면 흐름을 끄세요","교육 뒤 일반 메일이 처리되지 않도록 흐름을 끕니다. Teams가 막혀 본인 메일로 대체한다면, 받는 사람은 본인 한 명, 제목은 반드시 \u003ccode>[교육결과] 알림 확인\u003c/code>처럼 트리거 필터 [자동화실습]과 \u003cstrong>일치하지 않는 고정 문구\u003c/strong>로 설정하세요. 수신 제목을 발송 제목에 그대로 넣거나 [자동화실습]을 붙이면 자기 메일을 다시 처리해 반복 발송될 수 있습니다. 받은 제목 동적 콘텐츠는 본문에만 넣고, 출력 메일이 새 실행을 만들지 않는지 확인한 뒤 흐름을 끕니다."]],"checks":["Subject Filter가 [자동화실습]으로 제한되어 있다.","승인된 표준 테스트 채널 또는 본인 메일 대안을 사용했다.","새 메일로 시험하고 실제 알림과 실행 기록을 확인했다.","실습 종료 후 흐름을 껐다.","본인 메일 대체 시 발송 제목이 트리거 필터와 일치하지 않음을 확인했다."],"errors":[["팀/채널 목록이 안 보여요.","연결 계정과 팀 멤버십·게시 권한을 확인하세요. Workflows 앱 허용 여부는 조직 관리자에게 문의합니다."],["새 메일을 보냈는데 실행 기록이 없어요.","흐름 켜짐, 제목 필터, 트리거 폴더를 순서대로 확인하세요. Outlook 규칙이 다른 폴더로 옮기는지도 확인합니다."],["Teams가 막혀 진행할 수 없어요.","액션을 Office 365 Outlook Send an email (V2)로 바꾸고 받는 사람은 본인, 발송 제목은 [교육결과] 알림 확인으로 고정하세요. 입력 필터 [자동화실습]과 일치하지 않아야 합니다. 받은 제목은 본문에만 넣어 자기 메일의 재귀 발송을 막고, 종료 후 흐름을 끕니다."]],"sources":["outlook","teams","teamshow"],"tip":"강사: 20분 안에 완성하는 것이 목표예요. 채널 권한 문제는 오래 붙잡지 말고 본인 메일 대체안 또는 가상 연습으로 전환하세요."},{"id":"attachments","n":"05","title":"메일 첨부를 SharePoint에 모으기","subtitle":"복사해서 옮기던 작은 반복 작업을 흐름으로 바꿉니다.","tag":"SharePoint","icon":"folder","time":"20분","part":"cloud","goal":"가상 첨부파일을 승인된 테스트 폴더에 저장하는 흐름을 구성할 수 있어요.","prepare":["승인된 테스트 SharePoint 문서 라이브러리와 쓰기 권한","실습자료의 sample-notice.txt 등 작은 가상 첨부 1개"],"steps":[["먼저 저장 위치를 정하세요","SharePoint의 기존 문서 라이브러리 안에 승인된 테스트 폴더를 준비합니다. 본인이 업로드·확인할 수 있는지 수동으로 먼저 점검하세요. 실제 공용 업무 폴더를 대상으로 하지 않습니다."],["새 메일 V3 트리거를 제한하세요","새 흐름 \u003ccode>EDU_03_첨부저장\u003c/code>에 When a new email arrives (V3)를 추가합니다. 제목 필터는 \u003ccode>[자동화실습-첨부]\u003c/code>, Only with Attachments는 Yes로 설정합니다. 소량의 작은 가상 첨부 실습에서는 Include Attachments도 Yes로 설정합니다."],["첨부 배열을 반복하세요","\u003cstrong>Apply to each\u003c/strong>(각각에 적용)를 추가하고 트리거의 Attachments(첨부 배열)를 선택합니다. 서명 로고 같은 인라인 첨부는 IsInline이 false인 항목만 처리하도록 조건을 추가하세요."],["반복 안에 SharePoint 파일 만들기를 넣으세요","SharePoint \u003cstrong>Create file\u003c/strong>(파일 만들기)에서 Site Address와 Folder Path를 테스트 위치로 지정합니다. File Name에는 현재 첨부의 Name, File Content에는 현재 첨부의 Content/Content Bytes에 해당하는 콘텐츠 값을 넣으세요. 이름·ID는 파일 내용이 아닙니다."],["새 가상 메일로 확인하세요","이전 실행과 겹치지 않는 고유한 파일명을 사용하고, 작은 텍스트 파일 1개를 첨부한 새 테스트 메일을 보냅니다. 실행 기록, 저장 위치, 파일명, 실제 파일 내용을 확인하세요. 이 예제는 악성코드 검사나 보안 검증을 대신하지 않습니다."],["업무 적용 전에 중복과 대량 수신을 설계하세요","같은 이름의 파일과 재실행을 어떻게 처리할지 정하세요. 첨부가 많으면 Include Attachments를 No로 두고 반복 내부에서 Get Attachment (V2)에 메일 ID와 첨부 ID를 전달해 콘텐츠를 받는 방식도 검토합니다. 첫 실습과 운영 설계를 혼동하지 마세요."]],"checks":["대상이 실제 업무 폴더가 아닌 승인된 테스트 폴더다.","파일 이름과 파일 콘텐츠를 구분했다.","저장된 파일의 실제 내용까지 확인했다."],"errors":[["파일은 생겼는데 열리지 않아요.","File Content에 이름이나 첨부 ID를 넣지 않았는지 확인하세요. 실제 첨부 콘텐츠를 전달해야 합니다."],["목록 항목 ID를 요구해요.","SharePoint의 Add attachment를 선택한 것인지 확인하세요. 이번 실습은 문서 라이브러리에 Create file을 쓰는 예제입니다."],["파일이 중복되거나 덮어쓰기 문제가 생겨요.","자동 중복 처리가 구현된 예제가 아닙니다. 교육은 고유한 파일명으로 실행하고, 업무 적용 때 파일명·충돌 처리 규칙을 별도 설계하세요."]],"sources":["outlook","sharepoint","attach"],"tip":"교육 중에는 결과만 시연하고, 상세 따라 하기는 자율학습으로 남겨 두세요. 대량 수신과 재실행은 운영 설계 단계에서 다룹니다."},{"id":"excel","n":"06","title":"엑셀의 미완료 업무를 한 번에 알리기","subtitle":"온라인 엑셀은 워크시트가 아니라 ‘테이블’을 선택합니다.","tag":"Excel","icon":"table","time":"25분","part":"cloud","goal":"실습용 Excel 테이블의 미완료 행만 모아 본인에게 요약 메일을 보낼 수 있어요.","prepare":["실습자료 sample-tasks.xlsx 다운로드","비즈니스용 OneDrive 또는 SharePoint 테스트 폴더와 편집 권한"],"steps":[["실습 파일을 업로드하고 표를 확인하세요","sample-tasks.xlsx를 승인된 비즈니스용 OneDrive 또는 SharePoint 테스트 폴더에 업로드합니다. 파일의 업무목록 시트에는 \u003ccode>Tasks\u003c/code>라는 Excel 테이블이 이미 있어요. 테두리가 있는 셀 범위와 Excel 테이블은 다릅니다."],["처음에는 수동 실행으로 만드세요","인스턴트 클라우드 흐름 \u003ccode>EDU_04_미완료업무\u003c/code>에 Manually trigger a flow를 선택합니다. 예약 실행으로 바로 시작하지 않아야 반복 발송을 피할 수 있어요."],["테이블의 행을 읽으세요","Excel Online (Business)의 \u003cstrong>List rows present in a table\u003c/strong>(테이블에 있는 행 나열)에 위치·문서 라이브러리·파일·테이블 Tasks를 지정합니다. 로컬 C: 경로를 넣는 액션이 아닙니다. 이 파일은 5행이라 기본 범위 안에 있지만 기본 반환은 최대 256행이므로 큰 자료는 페이지 매김 설정을 검토해야 해요."],["미완료 행을 필터링하세요","데이터 작업(Data Operations)의 \u003cstrong>Filter array\u003c/strong>(배열 필터링)를 추가합니다. From은 행 나열의 \u003ccode>value\u003c/code> 배열, 조건은 각 행의 \u003ccode>Status\u003c/code>가 \u003ccode>완료\u003c/code>와 같지 않음입니다. UI에서 항목의 열을 고르기 어렵다면 식 \u003ccode>item()?['Status']\u003c/code>를 왼쪽 값으로 사용합니다. “진행중”과 “미시작” 3행이 남는 것이 이 자료의 기대 결과예요."],["한 통의 요약 메일로 만드세요","Create HTML table(HTML 테이블 만들기)에 Filter array의 Body(필터링된 배열)를 넣고 열은 우선 Automatic으로 둡니다. 다음 Office 365 Outlook Send an email (V2)의 \u003cstrong>받는 사람은 본인 한 명\u003c/strong>, \u003cstrong>제목은 \u003ccode>[교육결과] 미완료 업무 요약\u003c/code>\u003c/strong>, 본문은 HTML 테이블 출력으로 지정합니다. 제목에 [자동화실습]을 넣지 않아 다른 교육 흐름을 불필요하게 시작하지 않도록 하세요. From·CC·BCC는 비워 두고, 행마다 보내는 반복문 대신 한 통으로 요약합니다."],["테스트하고 결과를 비교하세요","저장 후 한 번 실행합니다. 수신 메일에 미완료 업무 3건이 들어 있는지 확인하세요. Excel 화면의 필터가 커넥터에도 자동 적용된다고 생각하면 안 됩니다. 이 예제는 상태만 필터링하며 마감일 계산은 하지 않습니다."],["운영 전에 동시 수정과 날짜를 점검하세요","Excel 커넥터는 동시 수정을 지원하지 않습니다. 다른 흐름·Excel 웹·데스크톱이 같은 파일에 동시에 쓰지 않도록 하세요. 마감일 확장 실습은 날짜 형식·빈 값·시간대·반복 알림 방지 규칙을 먼저 정한 뒤 추가합니다."]],"checks":["워크시트와 Excel 테이블 Tasks를 구분했다.","미완료 3행이 포함된 요약 메일 한 통을 본인에게 보냈다.","페이지 매김과 동시 수정 제한을 이해했다."],"errors":[["테이블 목록이 비어 있어요.","실제 Excel 테이블인지, 비즈니스용 저장 위치인지, 올바른 파일인지 확인하세요. 샘플은 Tasks 테이블이 있습니다."],["전체가 아닌 일부 행만 조회돼요.","기본 256행 반환과 액션 설정의 Pagination(페이지 매김)을 확인하세요. 256은 파일의 최대 행 수가 아닙니다."],["Excel 파일이 잠겼거나 쓰기가 실패해요.","동시에 파일을 수정하는 앱·흐름을 확인하세요. 공식 제한상 커넥터 사용 후 일정 시간 잠금이 남을 수 있습니다."]],"sources":["excel","outlook"],"tip":"DueDate는 연습용 ISO 날짜 텍스트로 넣었습니다. 초보 수업에서는 상태 필터만 다루고 날짜·시간대 식은 후속 과정으로 분리하세요."},{"id":"logic","n":"07","title":"조건·반복·변수, 세 가지만 이해하기","subtitle":"어려운 용어를 업무 문장으로 바꾸면 훨씬 쉽습니다.","tag":"기초 개념","icon":"branch","time":"10분","part":"basic","goal":"조건과 반복이 필요한 상황을 구분하고 동적 콘텐츠를 이해할 수 있어요.","prepare":["첫 메일 실습 또는 메일 → Teams 실습을 먼저 읽어 보세요."],"concepts":[["조건 Condition","“상태가 완료가 아니면 알린다”처럼 맞는 경우와 아닌 경우를 나눕니다."],["반복 Apply to each","첨부파일이 3개라면 각 첨부마다 파일 저장을 한 번씩 합니다."],["변수 Variable","진행 중 바뀔 값을 이름을 붙여 보관합니다. 예: 처리 건수."],["동적 콘텐츠 Dynamic content","앞 단계에서 받은 실제 값을 뒤 단계에 넣습니다. 예: 방금 도착한 메일 제목."]],"steps":[["조건을 일상 문장으로 써 보세요","“긴급이면 담당자에게 알림”의 ‘긴급인가?’가 조건입니다. 제목 필터처럼 트리거에서 범위를 좁히는 것과, 실행 후 조건 분기로 나누는 것은 다릅니다."],["한 개와 여러 개를 구분하세요","메일 한 통에도 첨부는 여러 개일 수 있어요. 배열을 선택하면 디자이너가 반복을 자동으로 추가하기도 합니다. 반복 안의 액션은 항목 수만큼 실행되므로 실제 발송 횟수를 확인하세요."],["고정 문구와 동적 값을 구분하세요","본문에 “Subject”라고 직접 쓰면 그 단어가 나옵니다. 새 메일 트리거의 Subject 동적 콘텐츠를 선택해야 도착한 메일 제목이 들어가요."],["복잡해지기 전에 종이에 그리세요","시작 → 조건 → 작업 → 결과 확인을 먼저 적습니다. 식을 복사하기 전에 입력 값과 기대 결과를 설명할 수 있어야 합니다."]],"checks":["조건과 트리거 필터의 차이를 이해했다.","반복 안의 메일 액션이 여러 번 발송될 수 있음을 이해했다.","고정 문구와 동적 콘텐츠를 구분할 수 있다."],"errors":[["자동으로 Apply to each가 생겼어요.","여러 항목을 가진 배열을 선택했는지 확인하세요. 없애기 전에 액션이 한 항목용인지 여러 항목용인지부터 파악합니다."]],"sources":["triggers","cloud","outlook"],"tip":"조건은 갈림길, 반복은 목록의 각 항목, 변수는 메모장에 비유하세요. 처음부터 긴 표현식을 외우게 하지 않습니다."},{"id":"desktop-start","n":"08","title":"내 PC에서 움직이는 데스크톱 자동화","subtitle":"클라우드와 다른 점, 설치와 실행 조건부터 확인합니다.","tag":"데스크톱","icon":"monitor","time":"10분","part":"desktop","goal":"데스크톱 흐름의 실행 환경과 로컬·클라우드 호출의 차이를 이해할 수 있어요.","prepare":["회사에서 허용한 Windows PC","Power Automate for desktop 설치·로그인 가능 여부"],"steps":[["회사 설치 정책을 먼저 확인하세요","Power Automate for desktop을 설치할 수 있는지 확인합니다. MSI 설치는 관리자 권한이 필요할 수 있고, Store 설치의 조건은 다릅니다. 회사 승인 없이 설치나 보안 설정을 바꾸지 마세요."],["계정과 환경을 점검하세요","회사 계정의 데스크톱 흐름 생성에는 적절한 환경·Dataverse 등의 조건이 있을 수 있습니다. 로그인 또는 환경 오류가 나면 관리자 확인 대상으로 남깁니다. 모든 Microsoft 365 계정에서 바로 된다고 가정하지 마세요."],["새 흐름과 액션 패널을 둘러보세요","Power Automate for desktop에서 새 흐름을 만들고 \u003ccode>EDU_05_파일복사\u003c/code>로 이름을 붙입니다. 액션을 순서대로 놓고 실행하는 구조를 확인하세요. 이 사이트에서 PC를 제어하거나 흐름을 자동 설치하지는 않습니다."],["직접 실행과 무인 실행을 구분하세요","내 PC에서 직접 눌러 실행하는 실습과 클라우드에서 PC를 호출하거나 사람이 없는 상태로 실행하는 운영은 다릅니다. 클라우드 연동·무인 실행을 기본 무료 기능으로 안내하지 않습니다. Windows 에디션과 라이선스·머신 구성도 별도 확인이 필요해요."],["화면 자동화의 취약점을 이해하세요","창 위치·로딩·화면 변경에 영향을 받을 수 있습니다. 사용할 수 있는 전용 액션이나 UI 요소 선택을 먼저 검토하고, 좌표 클릭만으로 모든 작업을 만들지는 마세요."]],"checks":["회사에서 설치와 로그인 사용이 가능한지 확인했다.","직접 실행과 클라우드 호출·무인 실행의 차이를 이해했다.","연습은 별도 테스트 폴더에서만 진행하기로 했다."],"errors":[["데스크톱 앱에서 새 흐름을 만들 수 없어요.","계정 유형과 기본 환경의 Dataverse 등 공식 요구사항을 관리자와 확인하세요. 개인 계정으로 회사 정책을 우회하지 않습니다."]],"sources":["desktop","requirements","license"],"tip":"1시간 수업에서는 2~3분 소개만 하고, 설치·계정 준비가 필요한 데스크톱 실습은 후속 자율학습으로 안내하세요."},{"id":"desktop-files","n":"09","title":"가상 파일 한 개, 안전하게 복사하기","subtitle":"이동·삭제보다 먼저, 원본이 남는 복사로 시작합니다.","tag":"파일 실습","icon":"copy","time":"15분","part":"desktop","goal":"Power Automate for desktop에서 파일을 복사하고 결과를 확인할 수 있어요.","prepare":["Power Automate for desktop 설치·로그인 완료","실습자료 sample-notice.txt","예: 문서 폴더 아래 PA-Practice 안에 input과 output 폴더를 직접 생성"],"steps":[["원본과 대상 폴더를 분리하세요","본인 문서 폴더에 PA-Practice/input과 PA-Practice/output을 만듭니다. input에 가상 sample-notice.txt만 넣습니다. 실제 다운로드·업무 공용 폴더 전체를 대상으로 하지 마세요. 예시 경로는 본인 PC의 실제 경로로 바꿉니다."],["Copy file(s) 액션을 추가하세요","새 데스크톱 흐름에서 \u003cstrong>Copy file(s)\u003c/strong>(파일 복사)를 추가합니다. Files to copy에 sample-notice.txt의 전체 경로를, Destination folder에는 이미 존재하는 output 폴더를 지정합니다. Move file(s)는 원본을 옮기는 다른 액션입니다."],["같은 파일이 있을 때의 규칙을 정하세요","If file exists는 \u003cstrong>Do nothing\u003c/strong>(아무 작업도 수행하지 않음)으로 설정합니다. 첫 실습에서는 Overwrite(덮어쓰기)를 사용하지 마세요. 관리자 실행이나 시스템 폴더는 필요하지 않습니다."],["한 번 실행하고 두 폴더를 확인하세요","저장 후 실행합니다. input의 원본이 그대로 있고 output에 복사본이 생겼는지 확인하세요. output 파일을 열어 내용이 같은지도 비교합니다. 출력 변수 CopiedFiles는 결과를 확인할 때 참고합니다."],["다시 실행해 멱등성을 생각해 보세요","같은 이름의 파일이 이미 있다면 Do nothing 규칙 때문에 새로 덮어쓰지 않아야 합니다. 재실행해도 원본이 사라지지 않는지 확인하세요. 그다음 단계에서만 파일 목록 조회 → 반복 → 확장자별 분류로 확장합니다."]],"checks":["업무 폴더가 아닌 연습 폴더만 대상으로 했다.","If file exists를 Do nothing으로 설정했다.","원본과 복사본의 존재 및 내용을 확인했다."],"errors":[["복사할 파일을 찾을 수 없어요.","폴더만 입력했는지, 전체 파일 경로와 확장자가 맞는지 확인하세요. 예시 경로를 그대로 사용하면 안 됩니다."],["두 번째 실행에서 파일이 안 바뀌어요.","Do nothing이면 의도된 동작일 수 있습니다. 덮어쓰기 전에 원본 보존과 충돌 처리 방침부터 정하세요."]],"sources":["files","requirements"],"tip":"삭제·이동·대량 작업은 기본 예제에서 제외합니다. 확장자별 분류도 복사로 먼저 검증한 뒤 운영 방식을 정하세요."},{"id":"troubleshoot","n":"10","title":"실패했을 때는 실행 기록부터","subtitle":"무작정 다시 실행하기보다, 어디까지 처리됐는지 확인합니다.","tag":"오류 해결","icon":"activity","time":"5분","part":"operation","goal":"실행 기록에서 실패 위치를 찾고 안전하게 재시험할 수 있어요.","prepare":["만든 EDU_ 흐름 1개","오류 화면을 공유할 때 계정·메일·내부 주소를 가릴 준비"],"steps":[["실행 기록이 있는지 확인하세요","포털의 내 흐름에서 해당 흐름을 선택하고 실행 기록을 확인합니다. 기록 자체가 없다면 흐름 켜짐, 새 이벤트 발생 여부, 제목 필터, 선택한 메일 폴더부터 확인하세요. 메뉴 이름은 디자이너에 따라 다를 수 있습니다."],["첫 실패 단계부터 보세요","기록이 있다면 실패·건너뜀·성공을 구분합니다. 입력·출력의 연결 계정, 대상 폴더/채널, 필수 값, 오류 코드를 확인하세요. 로그에는 실제 메일과 개인정보가 들어갈 수 있으므로 공개 저장소에 복사하지 않습니다."],["권한 오류와 데이터 오류를 나누세요","연결 만료·접근 거부·게시 권한은 계정/조직 설정 문제일 수 있습니다. 빈 값·잘못된 파일 경로·이름을 콘텐츠에 넣은 실수는 데이터/설정 문제일 수 있어요. 정책 차단을 우회하지 마세요."],["재실행 전에 이미 처리된 일을 확인하세요","메일이 발송됐거나 파일이 저장된 다음 단계에서 실패했을 수 있습니다. 처음부터 다시 실행하면 중복 발송·중복 저장이 생길 수 있어요. 작은 가상 데이터로 새 테스트를 하고 결과를 비교합니다."],["흐름을 끄고 변경점을 기록하세요","종료 후 흐름을 끕니다. 무엇이 실패했는지, 무엇을 바꿨는지, 새 시험의 결과가 어땠는지만 개인정보 없이 기록하세요. 성공 표시와 실제 업무 결과는 둘 다 확인해야 합니다."]],"checks":["실행 기록이 없는 경우와 중간 실패를 구분한다.","재실행 전에 이미 처리된 작업을 확인한다.","실제 결과와 실행 기록을 함께 확인한다."],"errors":[["계속 실행 버튼을 누르면 해결되나요?","아니요. 원인을 그대로 두면 중복 작업만 늘어날 수 있습니다. 실패 지점을 먼저 확인하세요."]],"sources":["cloud","outlook","excel"],"tip":"강사: 결과가 안 보이는 사람에게 “메일이 안 와요?”보다 “실행 기록은 생겼나요?”를 먼저 물어보세요."},{"id":"business","n":"11","title":"내 업무에 적용하기 전 7가지 질문","subtitle":"작동하는 흐름과 운영 가능한 흐름은 다릅니다.","tag":"업무 적용","icon":"check","time":"5분","part":"operation","goal":"작은 자동화 후보를 고르고 운영 전 점검할 수 있어요.","prepare":["자동화할 업무 한 가지","팀의 데이터 취급·공유·운영 정책"],"steps":[["규칙과 담당자를 정하세요","① 시작 조건·입력·예외가 명확한가? ② 흐름과 연결의 책임자가 정해져 있는가? 휴직·퇴사·담당 변경 때 연결과 소유권을 어떻게 관리할지도 정합니다."],["대상과 권한을 줄이세요","③ 필요한 최소 데이터·수신자·저장 위치만 쓰는가? 공유 흐름에서는 누가 어떤 연결로 실행하는지 확인합니다. 비밀번호·토큰·인증코드를 코드나 메모에 적지 마세요."],["중복과 실패를 설계하세요","④ 같은 이벤트를 다시 처리하면 어떻게 되는가? ⑤ 중간 실패를 누가 알아차리고 어떻게 복구하는가? 메일 발송·파일 생성·상태 변경 전에 식별자와 중복 방지 방안을 검토하세요. 특히 새 메일을 받아 다시 메일을 보내는 흐름은 출력 메일이 입력 필터와 일치하지 않는지 확인하여 자기 자신을 반복 호출하는 루프를 막으세요."],["비용과 변경에 대비하세요","⑥ 커넥터·라이선스·호출 한도·실행 빈도를 확인했는가? ⑦ 테스트·중지·인수인계 방법이 있는가? 조직 담당자의 검토 없이 유료 기능이나 대량 예약 실행으로 확장하지 않습니다."],["후보를 작은 단위로 적으세요","업무명 / 현재 수작업 / 시작 조건 / 처리 규칙 / 결과 위치 / 실패 시 담당자 / 승인 필요사항을 한 장에 적어 보세요. 첫 후보는 ‘실행 전에 내가 확인할 수 있고 실패해도 복구하기 쉬운 작업’이 좋아요."]],"checks":["자동화 책임자와 결과 확인 방법을 정했다.","수신자·저장 위치·권한을 최소화했다.","중복 처리·실패 복구·중지 방법을 검토했다."],"errors":[["작동하니까 바로 전사에 배포해도 되나요?","개인 테스트 성공은 운영·보안·권한 검증 완료를 의미하지 않습니다. 업무 책임자와 조직 정책을 먼저 확인하세요."]],"sources":["license","licensefaq","requirements"],"tip":"마지막에 각자 “내가 해 볼 가장 작은 자동화” 하나를 말하게 하면 수업이 업무로 이어집니다."},{"id":"review","n":"12","title":"복습: 작은 자동화 하나로 시작하기","subtitle":"기능을 외우기보다, 설명하고 확인할 수 있으면 됩니다.","tag":"마무리","icon":"book","time":"5분","part":"operation","goal":"배운 내용을 정리하고 다음 학습 경로를 고를 수 있어요.","prepare":["기초 용어와 첫 실습 내용을 떠올려 보세요."],"steps":[["오늘 배운 흐름을 설명해 보세요","수동 트리거 → 본인에게 메일 / 새 메일 트리거 → 제목 필터 → Teams 알림. 각각 언제 시작하고 무슨 일을 하는지 소리 내어 설명해 보세요."],["실습 종료를 확인하세요","본인 EDU_ 흐름이 꺼져 있는지, 원치 않는 예약·자동 실행이 남지 않았는지 확인합니다. 교육용 파일·게시물 정리는 승인된 범위 안에서만 합니다."],["이해도 체크를 해 보세요","사이트의 ‘이해도 체크’에서 6문제를 풀어 보세요. 점수는 공식 수료 인증이 아니며 계정으로 전송되지 않습니다. 틀린 문제는 해설을 읽고 관련 레슨을 다시 확인하세요."],["다음 경로를 선택하세요","메일 업무가 많다면 SharePoint 첨부 저장, 목록 관리가 많다면 Excel 요약, 내 PC에서 파일을 다룬다면 데스크톱 파일 복사를 선택하세요. 동시에 여러 자동화를 만들기보다 하나를 안정적으로 검증하세요."]],"checks":["만든 흐름의 종료 상태를 확인했다.","다음에 공부할 실습 하나를 골랐다.","실제 업무 적용은 별도 승인·검증이 필요함을 이해했다."],"errors":[["사이트의 완료 체크가 회사에 보고되나요?","아니요. 이 사이트의 학습 완료 기록은 현재 브라우저의 로컬 저장소에만 저장됩니다. 공식 수료·출결 시스템이 아닙니다."]],"sources":["types","license"],"tip":"수업에서 모든 레슨을 완료할 필요는 없어요. 1시간 코스와 자율학습 레슨을 구분해서 안내하세요."}],"agenda":[{"range":"00–10","label":"이해와 준비","title":"자동화의 원리를 알고, 안전하게 준비해요","desc":"익숙한 업무 사례로 트리거·액션과 클라우드·데스크톱을 구분합니다.","lessons":["start","prepare"],"teacher":"설명 7분 + 준비 확인 3분. 계정이 막히면 가상 연습으로 전환합니다."},{"range":"10–20","label":"첫 성공 경험","title":"버튼으로 나에게 테스트 메일 보내기","desc":"세 칸만 채운 작은 흐름으로 저장·실행·결과 확인을 익힙니다.","lessons":["first-mail"],"teacher":"메일 주소를 사이트가 아닌 Power Automate에서 입력하도록 안내하고, 수신자를 모두 확인한 뒤 한 번만 실행합니다."},{"range":"20–40","label":"핵심 실습","title":"메일 수신 → 교육용 Teams 알림","desc":"제목 필터와 동적 콘텐츠를 써서 두 서비스를 연결합니다.","lessons":["mail-teams"],"teacher":"만들기 12분 + 새 메일 테스트 5분 + 기록 확인 3분. Teams가 막히면 본인 메일 대체안으로 진행합니다."},{"range":"40–50","label":"업무로 확장","title":"SharePoint·Excel·데스크톱 맛보기","desc":"이 시간은 세 가지를 모두 만드는 실습이 아니라, 결과와 활용 사례를 보는 시연입니다.","lessons":["attachments","excel","desktop-start"],"teacher":"첨부 저장 3분, 엑셀 요약 4분, PC 파일 복사 3분. 세부 실습은 자율학습으로 안내합니다."},{"range":"50–60","label":"확인과 마무리","title":"실행 기록을 보고, 내 업무 하나 고르기","desc":"흐름을 끄고, 오류 확인 방법과 업무 적용 전 체크리스트를 살펴봅니다.","lessons":["troubleshoot","business","review"],"teacher":"오류 확인 3분 + 적용 후보 3분 + 흐름 중지·질문 4분. 이해도 체크는 복습용으로 남길 수 있습니다."}],"glossary":[["자동화","Automation","반복되는 일을 정해진 규칙에 따라 처리하는 것. 판단·승인까지 무조건 맡긴다는 뜻은 아닙니다."],["흐름","Flow","시작 조건과 작업을 순서대로 연결한 자동화의 단위."],["트리거","Trigger","흐름을 시작시키는 사건. 새 메일 도착, 버튼 클릭, 정해진 시간 등이 있어요."],["액션","Action","흐름 안에서 수행할 작업. 메일 보내기, 파일 만들기 등이에요."],["커넥터","Connector","Outlook·Teams 같은 서비스와 Power Automate를 연결하는 기능 모음."],["연결","Connection","어떤 계정과 권한으로 커넥터를 사용할지 정한 실제 인증 연결."],["동적 콘텐츠","Dynamic content","앞 단계의 실행 결과를 뒤 단계에 넣는 값. 예: 새 메일의 제목."],["조건","Condition","참·거짓에 따라 다음 행동을 나누는 규칙."],["배열","Array","여러 항목을 담은 목록. 첨부파일 여러 개나 Excel의 여러 행이 예입니다."],["반복","Apply to each","목록에 있는 각 항목에 같은 작업을 적용하는 것."],["변수","Variable","실행 중 값을 이름 붙여 보관하는 공간."],["환경","Environment","흐름과 데이터 등을 구분해서 관리하는 Power Platform의 작업 공간."],["표준·프리미엄","Standard / Premium","커넥터의 라이선스 분류. 표준이어도 회사 권한·정책 확인은 필요해요."],["테이블","Excel table","머리글과 이름이 있는 Excel의 구조화된 표. 워크시트 전체나 단순 테두리와 달라요."],["실행 기록","Run history","흐름이 언제 실행되고 각 단계에서 어떤 결과가 났는지 확인하는 기록."],["무인 실행","Unattended RPA","사람의 직접 조작 없이 PC 자동화를 실행하는 방식. 별도 환경·라이선스 검토가 필요해요."]],"faq":[["메일이 오지 않거나 Teams 알림이 안 와요.","먼저 실행 기록이 생겼는지 확인하세요. 없으면 흐름 켜짐·새 메일·제목 필터·실제 수신 폴더를 점검합니다. 기록이 있으면 첫 실패 단계의 연결·권한·대상·필수 값을 확인하세요. 트리거 지연 가능성도 고려합니다. 본인 메일 대체안은 발송 제목을 [교육결과] 알림 확인으로 고정하고, 입력 필터 [자동화실습]과 일치하지 않게 해 반복 발송을 막으세요.","troubleshoot"],["Teams에서 채널을 선택할 수 없어요.","연결 계정, 팀 멤버십, 게시 권한, Workflows 앱 허용 여부를 확인합니다. 이번 메시지 액션은 비공개 채널을 대상으로 하지 않습니다. 승인된 표준 채널 또는 본인 메일 대체 실습을 사용하세요. 본인 메일 대체 시 출력 제목은 [교육결과] 알림 확인으로 고정하며 입력 제목 필터와 일치하면 안 됩니다.","mail-teams"],["회사 Microsoft 365를 쓰면 전부 무료인가요?","아니요. 이 사이트의 기본 예제는 표준 커넥터 중심이지만, 사용자에게 할당된 사용 권한·환경·조직 정책은 별도 확인이 필요합니다. 프리미엄, 클라우드→데스크톱 호출, 무인 실행을 무료라고 가정하지 마세요.","prepare"],["엑셀 파일은 있는데 테이블이 안 보여요.","파일이 지원되는 비즈니스용 저장 위치에 있는지 확인하고, Excel의 삽입→표 기능으로 테이블을 만들었는지 확인하세요. 실습용 파일에는 Tasks 테이블이 미리 들어 있습니다.","excel"],["조회 결과가 256행에서 끝나요.","List rows present in a table의 기본 반환은 최대 256행입니다. 256은 파일 최대 행 수가 아닙니다. 액션 설정의 Pagination을 켜고 필요한 범위와 반환 결과를 검증하세요.","excel"],["데스크톱 앱에 로그인·설치가 안 돼요.","회사 설치 정책과 계정·환경·Dataverse 등 공식 요구사항을 확인해야 합니다. 조직 담당자에게 오류 내용을 민감정보를 가려 전달하세요. 개인 계정 우회는 하지 않습니다.","desktop-start"],["다시 실행하면 같은 메일이 또 보내지나요?","그럴 수 있습니다. 성공한 앞 단계가 있는데 뒤에서 실패했을 수도 있어요. 재실행 전에 발송·저장 결과를 확인하고 운영에서는 식별자와 중복 방지를 설계하세요.","business"],["사이트에서 실제 Power Automate를 실행하나요?","아니요. 가상 연습은 이 브라우저 안에서 준비된 예시를 보여 주는 시뮬레이션입니다. 계정 로그인·실제 발송·파일 업로드·PC 제어는 하지 않습니다.","start"],["진도가 다른 PC에도 이어지나요?","현재 브라우저의 로컬 저장소에만 보관됩니다. 동기화·출결 보고·공식 수료 인증은 제공하지 않습니다. 브라우저 데이터 삭제나 다른 브라우저 사용 시 기록이 없을 수 있어요.","review"]],"quiz":[{"q":"“교육용 메일이 도착하면 Teams에 알린다”에서 트리거는 무엇일까요?","a":["Teams에 알림 보내기","교육용 메일 도착","알림의 글자 색"],"correct":1,"why":"트리거는 시작 사건인 메일 도착, 액션은 Teams에 알림을 보내는 작업입니다.","lesson":"start"},{"q":"수동 실행 흐름을 저장했는데 메일이 오지 않아요. 먼저 확인할 것은?","a":["실제로 한 번 실행했는지 확인한다","수신자를 전체 직원으로 바꾼다","같은 흐름을 10개 만든다"],"correct":0,"why":"저장은 설계도를 보관하는 것이며 실행과 다릅니다. 본인 수신자를 확인한 뒤 한 번 실행하고 기록을 보세요.","lesson":"first-mail"},{"q":"첫 Teams 연동 실습에 적절한 장소는?","a":["실제 고객 상담 채널","아무 비공개 채널","승인된 표준 테스트 채널"],"correct":2,"why":"교육용으로 승인된 표준 채널을 사용합니다. 이번 메시지 게시 액션은 비공개 채널 게시를 지원하지 않습니다.","lesson":"mail-teams"},{"q":"Excel 행 조회 액션이 기본 256행만 반환한다는 뜻은?","a":["Excel은 256행까지만 저장할 수 있다","더 조회하려면 페이지 매김과 결과를 확인해야 한다","Excel 화면에서 필터를 없애면 항상 모두 조회된다"],"correct":1,"why":"256행은 액션의 기본 반환 한도입니다. 파일의 최대 행 수가 아니며 Pagination 설정과 결과 검증이 필요합니다.","lesson":"excel"},{"q":"실패한 흐름을 다시 실행하기 전에 할 일은?","a":["앞에서 이미 발송·저장된 결과가 있는지 확인한다","성공할 때까지 반복 클릭한다","보안 정책을 우회한다"],"correct":0,"why":"중간 실패라도 앞 단계는 이미 처리됐을 수 있습니다. 재실행하면 중복 발송이나 저장이 생길 수 있어요.","lesson":"troubleshoot"},{"q":"로컬 데스크톱 파일 복사가 되면 무인 실행도 같은 조건으로 가능한가요?","a":["네, 모든 기능은 자동으로 무료다","PC 전원을 끄면 무인 실행이 된다","아니요, 별도 실행 환경과 라이선스를 확인한다"],"correct":2,"why":"직접 누르는 로컬 실행과 클라우드 호출·무인 실행은 조건이 다릅니다. 회사 계정·정책·라이선스를 따로 확인하세요.","lesson":"desktop-start"}]};

function desktop(){return intro('DESKTOP AUTOMATION','내 PC의 반복 작업도, 차근차근.','설치·계정 조건을 먼저 확인하고 원본을 보존하는 파일 복사부터 시작합니다. 1시간 수업 이후의 자율학습 코스입니다.')+notice('<strong>실행 조건을 먼저 확인하세요.</strong> 회사의 설치 정책, 계정·환경 조건이 필요할 수 있습니다. 로컬 직접 실행과 클라우드 호출·무인 실행은 같지 않으며, 추가 기능의 라이선스는 별도 확인해야 합니다.','warn')+'<div class="spacer"></div><div class="grid cols2">'+DATA.lessons.filter(l=>l.part==='desktop').map(lessonCard).join('')+'</div><div class="spacer"></div><section class="article-card"><h2>첫 실습은 이만큼만 해도 충분해요</h2><div class="concept-grid"><div class="concept"><strong>안전한 시작</strong><p>연습 폴더에서 가상 텍스트 파일 1개를 복사합니다. 같은 이름이 있으면 아무 작업도 하지 않도록 설정해요.</p></div><div class="concept"><strong>나중에 확장하기</strong><p>파일 목록 조회 → 반복 → 확장자별 복사로 넓힙니다. 삭제·이동·덮어쓰기·무인 실행은 기초 실습에서 제외해요.</p></div></div><div class="buttons"><button class="btn" data-download="sample-notice.txt">'+icon('download',14)+' 가상 파일 받기</button></div></section>'+sourceLinks(['desktop','requirements','files','license'])}
function lessonPage(id){const l=lessonBy(id);if(!l)return notFound();const checks=Array.isArray(state.checks[id])?state.checks[id]:[];const idx=DATA.lessons.indexOf(l);return '<a class="back-link" href="#'+(l.part==='desktop'?'desktop':l.part==='operation'?'course':'labs')+'">'+icon('back',13)+' 학습 목록으로</a><div class="lesson-layout"><article class="lesson-main"><header class="lesson-title"><div class="pills"><span class="tag blue">LESSON '+l.n+'</span><span class="tag">'+l.tag+'</span><span class="tag">'+icon('clock',11)+' '+l.time+'</span></div><h1>'+l.title+'</h1><p>'+l.subtitle+'</p></header>'+notice('<strong>공식 문서 확인 / 실계정 실행 미검증</strong><br>교육용으로 조합한 절차입니다. 메뉴·번역·사용 가능 여부는 디자이너, 라이선스, 회사 정책과 권한에 따라 다를 수 있어요. 실제 메일·게시·저장은 Microsoft 포털에서 별도로 실행됩니다.')+'<div class="spacer"></div><section class="article-card" id="goal"><h2>이번에 할 수 있게 되는 것</h2><p>'+l.goal+'</p></section><section class="article-card" id="prepare"><h2>시작 전 준비</h2><ul>'+l.prepare.map(p=>'<li>'+p+'</li>').join('')+'</ul>'+(l.id==='excel'?'<button class="btn small" data-download="sample-tasks.xlsx">'+icon('download',13)+' 실습용 Excel 받기</button>':l.id==='desktop-files'||l.id==='attachments'?'<button class="btn small" data-download="sample-notice.txt">'+icon('download',13)+' 가상 텍스트 파일 받기</button>':'')+'</section>'+(l.concepts?'<section class="article-card"><h2>쉽게 이해하기</h2><div class="concept-grid">'+l.concepts.map(c=>'<div class="concept"><strong>'+c[0]+'</strong><p>'+c[1]+'</p></div>').join('')+'</div></section>':'')+'<section class="article-card" id="steps"><div class="section-head"><h2 style="margin:0">'+(l.part==='cloud'||l.id==='desktop-files'?'차근차근 따라 하기':'차근차근 이해하기')+'</h2><button class="btn ghost small" id="expand-steps">모두 펼치기</button></div>'+l.steps.map((s,i)=>'<details class="step"'+(i===0?' open':'')+'><summary><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+s[0]+'</summary><div class="step-content">'+s[1]+'</div></details>').join('')+'</section><section class="article-card" id="verify" function resources(){return intro('RESOURCES & REFERENCES','준비된 자료로, 안전하게 연습해요.','실습자료는 자체 생성한 가상 데이터입니다. 공식 문서는 링크로 제공하며 원문 전체를 복제하지 않습니다.')+'<section><div class="section-head"><div><h2>실습자료 다운로드</h2><p>이 사이트는 다운로드 외에 파일 업로드·계정 연결을 요구하지 않습니다.</p></div></div><div class="grid cols2">'+materialInfo.map(m=>'<div class="card resource-card"><span class="card-icon">'+icon(m[3],20)+'</span><div class="resource-detail"><h3>'+m[1]+'</h3><p>'+m[2]+'</p><small class="doc-date">'+m[0]+'</small></div><button class="btn small" data-download="'+m[0]+'" aria-label="'+m[1]+' 다운로드">'+icon('download',14)+' 받기</button></div>').join('')+'</div></section><div class="spacer"></div>'+notice('<strong>Excel 자료 안내</strong> · DueDate는 2026년 11월의 고정된 가상 날짜 텍스트입니다. 현재 날짜로 자동 갱신되지 않으며, 기본 실습은 날짜가 아닌 Status(상태)만 필터링합니다.')+'<div class="spacer"></div><section><div class="section-head"><div><h2>공식 문서 모음 <span class="source-badge">14 SOURCES</span></h2><p>Microsoft Learn 중심 · 문서 확인 '+DATA.updated+' · 실제 회사 계정 실행은 미검증</p></div></div><div class="grid cols2">'+DATA.sources.map(s=>'<a class="card link-card" href="'+s.url+'" target="_blank" rel="noopener noreferrer"><div class="card-top"><span class="tag">'+s.topic+'</span>'+icon('external',15)+'</div><h3 style="font-size:14px">'+s.title+'</h3><p>Microsoft Learn · 공식 문서</p></a>').join('')+'</div></section><div class="spacer"></div><section class="article-card"><h2>이 사이트의 범위와 기록</h2><ul><li>독립적인 입문 교육 자료이며 Microsoft가 운영·인증하는 사이트가 아닙니다.</li><li>실제 서비스 인증·발송·업로드·데스크톱 제어·AI API 연결은 없습니다. 공식 문서 링크는 클릭할 때 외부 사이트로 이동합니다.</li><li>학습 체크는 이 브라우저의 localStorage에만 저장되며 계정 동기화·출결·공식 수료 기능이 아닙니다.</li><li>회사 계정에서의 메뉴·사용 권한·조직 데이터 정책·라이선스·실행 결과는 별도로 확인해야 합니다.</li><li>Microsoft 제품명은 설명을 위해 사용하며 실습자료는 자체 생성한 가상 데이터입니다.</li></ul><button class="btn small danger" id="reset-progress">'+icon('reset',13)+' 내 학습 기록 초기화</button><p class="doc-date" style="margin-top:10px">초기화는 이 브라우저의 사이트 학습 체크에만 적용됩니다. 실제 Power Automate 흐름은 변경하지 않습니다.</p></section>'}
function instructor(){return intro('INSTRUCTOR NOTES','처음 가르치는 분도, 순서대로.','수강생에게 많은 기능을 보여 주기보다 두 번의 작은 성공을 함께 만듭니다.')+'<div class="instructor-layout"><div><section class="article-card"><h2>교육 전 반드시 확인하기</h2><div class="check-grid">'+['일반 수강생 계정의 포털 접근과 환경 선택','Office 365 Outlook 연결과 본인 테스트 발송','Teams Workflows 앱 허용과 표준 채널 게시 권한','Teams 차단 시 본인 메일 대체 흐름 준비','가상 파일만 사용하고 실제 업무자료 제외','실제 흐름으로 사전 리허설하고 예상 소요시간 확인','EDU_ 흐름 중지와 테스트 자료 정리 방침','SharePoint·Excel·데스크톱은 시연용 결과 준비'].map(t=>'<label class="check-label"><input type="checkbox"><span>'+t+'</span></label>').join('')+'</div><p class="doc-date" style="margin-top:15px">이 체크는 현재 화면용 준비 메모입니다. 회사 환경이 확인됐다는 인증이 아닙니다.</p></section><section class="article-card"><h2>60분 진행표</h2>'+DATA.agenda.map(a=>'<h3><span style="color:var(--blue)">'+a.range+'분</span> · '+a.title+'</h3><p>'+a.teacher+'</p>').join('')+'</section><section class="article-card"><h2>막힐 때의 대체안</h2><h3>Teams가 차단된 경우</h3><p>새 메일 V3 트리거의 제목 필터는 유지하고 액션만 본인에게 메일 보내기로 대체하되 발송 제목은 <code>[교육결과] 알림 확인</code>으로 고정합니다. 출력 제목에 [자동화실습]을 넣거나 받은 제목을 그대로 사용하면 자기 메일이 재귀 처리될 수 있습니다. 받은 제목은 본문에만 넣고 출력 메일이 입력 필터와 일치하지 않는지 확인하세요. 실제 발송이 어려우면 업무별 실습실의 가상 연습으로 전환하세요.</p><h3>포털 접근 자체가 안 되는 경우</h3><p>계정·정책을 현장에서 우회하지 않습니다. 준비된 화면과 사이트 가상 연습으로 원리를 설명하고, 조직 담당자에게 확인할 항목을 남깁니다.</p><h3>시간이 모자란 경우</h3><p>핵심 실습의 결과 확인과 흐름 중지를 우선합니다. SharePoint·Excel·데스크톱은 한 가지 사례만 소개하고 상세 실습은 자율학습으로 남깁니다.</p></section><section class="article-card"><h2>마지막 2분, 꼭 말해 주세요</h2><div class="code-block">“본인이 만든 EDU_ 흐름을 꺼 주세요.\n실행 성공과 실제 결과를 둘 다 확인해 주세요.\n업무 적용 전에는 권한·중복·실패 대응을 검토해 주세요.\n다음에는 가장 작은 자동화 하나부터 시작해 보세요.”</div></section></div><aside><div class="aside-card"><h3>강사의 목표</h3><p>① 트리거와 액션을 설명한다.<br>② 본인에게 테스트 메일을 보낸다.<br>③ 메일 → 알림 연결을 이해한다.<br>④ 실행 기록과 중지 방법을 안다.</p></div><div class="aside-card"><h3>진행 자료</h3><button class="btn primary" data-download="instructor-notes.md">'+icon('download',13)+' 진행 노트 받기</button><button class="btn" id="print-page">'+icon('print',13)+' 이 페이지 인쇄</button><a class="btn" href="#course">1시간 코스 화면</a></div>'+notice('<strong>교육시간과 레슨 시간은 달라요.</strong> 전체 12개 레슨은 자율학습까지 포함합니다. 1시간 수업에서는 모든 실습을 완성하지 않습니다.','warn')+'</aside></div>'}
let quizIndex=0,quizAnswers=[];
function quiz(){let html=intro('CHECK YOUR UNDERSTANDING','이해했는지, 가볍게 확인해요.','6문제로 핵심만 복습합니다. 점수는 공식 수료 인증이 아니며 서버로 전송되지 않습니다.');if(quizIndex>=DATA.quiz.length){const correct=quizAnswers.filter((a,i)=>a===DATA.quiz[i].correct).length;return html+'<div class="quiz-container"><div class="card quiz-score"><div class="eyebrow" style="justify-content:center">NICE FIRST STEP</div><h2>복습을 마쳤어요.</h2><strong>'+correct+'<span style="font-size:22px;color:#a2b0c3"> / 6</span></strong><p>틀린 문제는 관련 레슨을 다시 읽어 보세요.<br>중요한 건 안전하게 설명하고 확인할 수 있는 거예요.</p><div class="buttons" style="justify-content:center"><button class="btn primary" id="quiz-restart">다시 풀기</button><a class="btn" href="#course">코스 돌아보기</a></div></div><div class="spacer"></div>'+DATA.quiz.map((q,i)=>'<div class="card" style="margin-bottom:12px"><span class="tag '+(quizAnswers[i]===q.correct?'green':'orange')+'">문제 '+(i+1)+' · '+(quizAnswers[i]===q.correct?'정답':'다시 보기')+'</span><h3 style="font-size:14px;margin-top:10px">'+q.q+'</h3><p>'+q.why+'</p><div style="margin-top:12px">'+lessonLink(q.lesson,'관련 레슨')+'</div></div>').join('')+'</div>'}const q=DATA.quiz[quizIndex];const answered=quizAnswers[quizIndex]!==undefined;return html+'<div class="quiz-container"><div class="article-card"><div class="quiz-count">QUESTION '+String(quizIndex+1).padStart(2,'0')+' / 06</div><div class="progress-track" style="margin-bottom:25px;height:4px"><div class="progress-fill" style="width:'+(quizIndex/6*100)+'%"></div></div><h2 style="font-size:21px">'+q.q+'</h2>'+q.a.map((a,i)=>'<button class="quiz-choice '+(answered?(i===q.correct?'correct':i===quizAnswers[quizIndex]?'wrong':''):'')+'" data-answer="'+i+'" '+(answered?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+a+'</button>').join('')+(answered?'<div class="quiz-explanation" role="status"><strong>'+(quizAnswers[quizIndex]===q.correct?'맞았어요.':'괜찮아요, 이렇게 기억해 보세요.')+'</strong><br>'+q.why+'</div><div class="buttons"><button class="btn primary" id="quiz-next">'+(quizIndex===5?'결과 보기':'다음 문제')+' '+icon('arrow',14)+'</button>'+lessonLink(q.lesson,'관련 레슨')+'</div>':'<p class="doc-date" style="margin-top:17px">답을 고르면 바로 해설이 나옵니다.</p>')+'</div></div>'}
function searchPage(query){const q=query.toLowerCase().trim();const hits=DATA.lessons.filter(l=>(l.title+' '+l.subtitle+' '+l.tag+' '+l.goal+' '+JSON.stringify(l.steps)).toLowerCase().includes(q));const terms=DATA.glossary.filter(g=>g.join(' ').toLowerCase().includes(q));const sources=DATA.sources.filter(s=>(s.title+' '+s.topic).toLowerCase().includes(q));return intro('FIND YOUR NEXT STEP','“'+escapeHTML(query)+'” 검색 결과','레슨 제목·본문·용어·공식 문서에서 찾습니다. 검색어는 서버로 전송하지 않습니다.')+'<p class="tiny muted" style="margin-bottom:17px">레슨 '+hits.length+'개 · 용어 '+terms.length+'개 · 공식 문서 '+sources.length+'개</p>'+(hits.length?'<div class="grid cols3">'+hits.map(lessonCard).join('')+'</div>':'')+(terms.length?'<div class="spacer"></div><h2 style="font-size:19px;margin-bottom:15px">용어 사전</h2><dl class="glossary">'+terms.map(g=>'<div class="glossary-item"><dt>'+g[0]+'<small>'+g[1]+'</small></dt><dd>'+g[2]+'</dd></div>').join('')+'</dl>':'')+(sources.length?'<div class="spacer"></div><h2 style="font-size:19px;margin-bottom:15px">공식 문서</h2>'+sourceLinks(sources.map(s=>s.id)):'')+(!hits.length&&!terms.length&&!sources.length?'<div class="card empty">일치하는 내용이 없어요.<br>“메일”, “Teams”, “엑셀”, “권한”처럼 짧은 키워드로 검색해 보세요.</div>':'')}
function notFound(){return intro('PAGE NOT FOUND','페이지를 찾지 못했어요.','학습 홈에서 다시 시작해 주세요.')+'<a class="btn primary" href="#home">학습 홈</a>'}
let currentRoute='home';let currentLesson='';
function render(keepScroll=false){const bits=location.hash.replace(/^#/,'').split('/');const route=bits[0]||'home';currentRoute=route;currentLesson=route==='lesson'?(bits[1]||''):'';let view;try{switch(route){case 'home':view=home();break;case 'course':view=course();break;case 'labs':view=labs();break;case 'desktop':view=desktop();break;case 'lesson':view=lessonPage(currentLesson);break;case 'glossary':view=glossary();break;case 'help':view=help();break;case 'resources':view=resources();break;case 'instructor':view=instructor();break;case 'quiz':view=quiz();break;case 'search':view=searchPage(decodeURIComponent(bits.slice(1).join('/')));break;default:view=notFound()}}catch(e){console.error(e);view=notFound()}$('#main').innerHTML=view+footer();const nav=route==='lesson'?(lessonBy(currentLesson)?.part==='desktop'?'desktop':'labs'):route;document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===nav;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const label=route==='lesson'?(lessonBy(currentLesson)?.title||'레슨'):route==='search'?'학습 내용 검색':routeMap.find(r=>r[0]===route)?.[2]||'학습 홈';$('#crumb-current').textContent=label;document.title=label+' | Power Automate 첫걸음 · FLOW CLASS';closeMenu();bindView();updateTimer();if(!keepScroll){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}}
function bindView(){document.querySelectorAll('[data-download]').forEach(b=>b.addEventListener('click',()=>download(b.dataset.download)));document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{labFilter=b.dataset.filter;render(true)}));document.querySelectorAll('[data-anchor]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById(a.dataset.anchor)?.scrollIntoView({behavior:'smooth'})}));document.querySelectorAll('[data-check]').forEach(c=>c.addEventListener('change',()=>{const id=c.dataset.lesson;const n=Number(c.dataset.check);if(!Array.isArray(state.checks[id]))state.checks[id]=[];state.checks[id]=state.checks[id].filter(i=>i!==n);if(c.checked)state.checks[id].push(n);if(!c.checked&&done(id)){state.completed=state.completed.filter(x=>x!==id);$('#completion-note').innerHTML=''}persist();const b=$('#complete-lesson');if(b){b.disabled=!done(id)&&state.checks[id].length!==lessonBy(id).checks.length;b.classList.toggle('primary',!done(id));b.innerHTML=icon('check',14)+' '+(done(id)?'완료 기록 해제':'학습 완료로 표시')}}));$('#complete-lesson')?.addEventListener('click',e=>{const id=e.currentTarget.dataset.id;if(done(id)){state.completed=state.completed.filter(x=>x!==id);toast('학습 완료 기록을 해제했어요.')}else{if((state.checks[id]||[]).length!==lessonBy(id).checks.length)return;state.completed.push(id);toast('학습 완료로 기록했어요. 이 브라우저에만 저장됩니다.')}persist();render(true)});$('#expand-steps')?.addEventListener('click',e=>{const els=[...document.querySelectorAll('.step')];const open=els.some(d=>!d.open);els.forEach(d=>d.open=open);e.currentTarget.textContent=open?'모두 접기':'모두 펼치기'});$('#sim-email')?.addEventListener('change',e=>{const texts={match:'[자동화실습] 자료 확인 요청',skip:'이번 주 점심 메뉴 안내',match2:'[자동화실습] 가상 일정 확인'};$('#sim-subject').textContent=texts[e.target.value];$('#run-log').className='run-log';$('#run-log').textContent='메일을 선택했어요. 가상으로 실행해 보세요.'});$('#simulate')?.addEventListener('click',simulate);$('#reset-progress')?.addEventListener('click',()=>{if(confirm('이 브라우저의 학습 체크를 모두 초기화할까요? 실제 Power Automate 흐름은 변경되지 않습니다.')){state={completed:[],checks:{}};persist();render(true);toast('이 브라우저의 학습 기록을 초기화했어요.')}});$('#print-page')?.addEventListener('click',()=>window.print());document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(quizAnswers[quizIndex]!==undefined)return;quizAnswers[quizIndex]=Number(b.dataset.answer);render(true)}));$('#quiz-next')?.addEventListener('click',()=>{quizIndex++;render(true)});$('#quiz-restart')?.addEventListener('click',()=>{quizIndex=0;quizAnswers=[];render(true)});$('#timer-toggle')?.addEventListener('click',toggleTimer);$('#timer-reset')?.addEventListener('click',()=>{timerRunning=false;timerRemaining=3600000;timerDeadline=0;updateTimer()})}
function simulate(){const match=$('#sim-email').value!=='skip';const subject=$('#sim-subject').textContent;const log=$('#run-log');log.className='run-log active';log.innerHTML='<div class="log-row">'+icon('check',15)+'<div><b>가상 새 메일을 확인했어요.</b><small>교육용 예시 데이터 · 실제 수신 아님</small></div></div>'+(match?'<div class="log-row">'+icon('check',15)+'<div><b>제목 필터와 일치해요.</b><small>[자동화실습] 문자열이 포함되어 있어요.</small></div></div><div class="log-row">'+icon('teams',16)+'<div><b>가상 Teams 알림을 만들었어요.</b><div class="message-bubble">교육용 메일이 도착했습니다.<br>제목: '+escapeHTML(subject)+'<br>보낸 사람: 교육담당 A · 가상 인물</div></div></div>':'<div class="log-row">'+icon('help',15)+'<div><b style="color:#8c753e">필터가 맞지 않아 시작하지 않아요.</b><small>Teams 알림 없음 · 실제 서비스에서는 새 실행 기록이 생기지 않을 수 있어요.</small></div></div>')}
function download(name){const entry=MATERIALS[name];if(!entry){toast('자료를 찾지 못했어요.');return}const raw=atob(entry.base64);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:entry.mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(name+' 다운로드를 요청했어요.')}
let timerRemaining=3600000,timerRunning=false,timerDeadline=0;
function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,timerDeadline-Date.now());timerRunning=false}else{if(timerRemaining<=0)timerRemaining=3600000;timerDeadline=Date.now()+timerRemaining;timerRunning=true}updateTimer()}
function updateTimer(){if(timerRunning){timerRemaining=Math.max(0,timerDeadline-Date.now());if(timerRemaining<=0){timerRunning=false;toast('1시간 수업 타이머가 끝났어요. 만든 흐름을 껐는지 확인해 주세요.')}}const el=$('#timer-display');if(el){const total=Math.ceil(timerRemaining/1000);el.textContent=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');const b=$('#timer-toggle');b.textContent=timerRunning?'일시정지':timerRemaining===3600000?'시작':'계속';b.setAttribute('aria-label','수업 타이머 '+(timerRunning?'일시정지':'시작'))}}
setInterval(updateTimer,500);initShell();window.addEventListener('hashchange',()=>render());render();if(!storageAvailable)toast('브라우저의 로컬 진도 저장을 사용할 수 없어요. 학습 기능은 계속 이용할 수 있습니다.');

</script></body></html>
