const DATA={"updated":"2026-11-03","sources":[{"id":"types","title":"Power Automate와 흐름 종류","url":"https://learn.microsoft.com/en-us/power-automate/flow-types","topic":"기초 개념"},{"id":"triggers","title":"트리거 소개와 수동 실행","url":"https://learn.microsoft.com/ko-kr/power-automate/triggers-introduction","topic":"기초 개념"},{"id":"cloud","title":"클라우드 흐름 개요","url":"https://learn.microsoft.com/en-us/power-automate/overview-cloud","topic":"클라우드"},{"id":"outlook","title":"Office 365 Outlook 커넥터","url":"https://learn.microsoft.com/ko-kr/connectors/office365/","topic":"Outlook"},{"id":"teams","title":"Teams 커넥터와 사용 제한","url":"https://learn.microsoft.com/en-us/connectors/teams/","topic":"Teams"},{"id":"teamshow","title":"Teams에 메시지 보내기","url":"https://learn.microsoft.com/ko-kr/power-automate/teams/send-a-message-in-teams","topic":"Teams"},{"id":"sharepoint","title":"SharePoint 커넥터와 파일 만들기","url":"https://learn.microsoft.com/ko-kr/connectors/sharepointonline/","topic":"SharePoint"},{"id":"attach","title":"메일 첨부를 SharePoint에 저장하기","url":"https://learn.microsoft.com/ko-kr/training/modules/email-power-automate/5-save-sharepoint","topic":"SharePoint"},{"id":"excel","title":"Excel Online (Business) 커넥터","url":"https://learn.microsoft.com/ko-kr/connectors/excelonlinebusiness/","topic":"Excel"},{"id":"license","title":"Power Automate 라이선스 유형","url":"https://learn.microsoft.com/en-us/power-platform/admin/power-automate-licensing/types","topic":"라이선스"},{"id":"licensefaq","title":"Power Automate 라이선스 FAQ","url":"https://learn.microsoft.com/en-us/power-platform/admin/power-automate-licensing/faqs","topic":"라이선스"}],"lessons":[{"id":"start","n":"01","title":"자동화, 어디서부터 시작할까요?","subtitle":"반복되는 일을 규칙으로 설명하는 것부터 시작합니다.","tag":"기초 개념","icon":"spark","time":"7분","part":"basic","goal":"자동화에 적합한 업무를 고르고 클라우드 흐름의 트리거와 액션을 설명할 수 있어요.","prepare":["특별한 프로그램 없이 이 페이지를 읽어도 됩니다.","내가 반복하는 업무 한 가지를 떠올려 보세요."],"concepts":[["클라우드 흐름","메일이 도착하거나 정해진 시간이 되면, 서비스의 연결 기능인 커넥터를 통해 작업해요. 예: Outlook 메일 → Teams 알림."],["트리거","흐름을 시작하는 사건이에요. 새 메일 도착, 버튼 클릭, 매일 오전 9시처럼 ‘언제?’에 해당해요."],["액션","시작 뒤에 할 일이에요. 메일 보내기, 파일 만들기, 메시지 게시처럼 ‘무엇을?’에 해당해요."]],"steps":[["업무를 한 문장으로 바꿔 보세요","“매일 반복해서 한다”만으로는 부족해요. <strong>언제 → 어떤 조건이면 → 무엇을 한다</strong>로 적어 보세요. 예: 교육용 메일이 도착하면 → 제목에 [자동화실습]이 있으면 → 교육용 Teams 채널에 알린다."],["좋은 첫 자동화를 고르세요","규칙이 명확하고, 입력 형태가 일정하고, 잘못 실행되어도 복구가 쉬운 일을 고르세요. 승인·결제·삭제·대량 외부 발송은 첫 실습에서 제외합니다."],["연결할 서비스를 확인하세요","이번 교육은 Outlook·Teams·SharePoint·Excel Online을 연결하는 클라우드 흐름에 집중해요. 필요한 표준 커넥터와 연결 권한을 확인하고, 조직에서 허용한 서비스와 데이터만 사용하세요."],["이번 수업의 성공 기준을 확인하세요","모든 기능을 외우는 수업이 아니에요. 본인에게 테스트 메일을 보내고, 교육용 메일에서 알림이 생기는 원리를 이해하면 첫 목표 달성이에요."]],"checks":["트리거와 액션의 차이를 말할 수 있다.","클라우드 흐름에서 연결할 서비스와 필요한 권한을 설명할 수 있다.","안전하게 연습할 업무 하나를 골랐다."],"errors":[["AI가 알아서 모든 업무를 판단하나요?","이번 수업의 자동화는 미리 정한 규칙을 따릅니다. 생성형 AI 기능은 기초 범위에 넣지 않습니다."],["화면을 항상 켜 둬야 하나요?","이번 수업의 클라우드 흐름은 서비스에서 실행되므로 브라우저 창을 계속 열어 둘 필요는 없어요. 흐름의 켜짐 상태, 계정 연결과 권한이 유효한지 확인하세요."]],"sources":["types","cloud"]},{"id":"prepare","n":"02","title":"실습 전, 안전하게 준비하기","subtitle":"계정이 있다고 모든 자동화를 사용할 수 있는 것은 아닙니다.","tag":"준비 체크","icon":"shield","time":"3분","part":"basic","goal":"실습에 필요한 권한과 교육용 공간을 확인할 수 있어요.","prepare":["회사 Microsoft 365 계정과 브라우저","강사가 승인받은 교육용 Teams 표준 채널 또는 본인 테스트 방식"],"steps":[["Power Automate에 접속하세요","<a class=\"neutral-link\" href=\"https://make.powerautomate.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Power Automate 포털</a>에 회사 계정으로 접속합니다. 회사에서 허용한 환경을 사용하세요. 접근이 안 되거나 환경을 선택할 수 없으면 관리자 확인이 필요합니다. 새 환경·유료 체험을 임의로 만들 필요는 없어요."],["연결과 사용 권한을 확인하세요","Office 365 Outlook 연결을 만들 수 있는지 확인하세요. 이번 예제의 Outlook·Teams·SharePoint·Excel Online (Business)는 표준 커넥터지만, 조직 데이터 정책·조건부 액세스·라이선스·서비스 권한에 따라 제한될 수 있어요. 회사 정책을 우회하지 않습니다."],["테스트 공간을 분리하세요","Teams는 승인된 <strong>표준 교육용 채널</strong>, SharePoint는 테스트 폴더, 메일은 본인 계정을 사용하세요. 실제 고객·인사·급여·계약 자료는 넣지 마세요. 제목은 [자동화실습]으로 통일합니다."],["강사와 수강생의 차이를 확인하세요","강사 계정만 되는지 확인하는 것으로 끝내지 마세요. 일반 수강생 권한 계정에서 연결·게시·업로드를 미리 확인합니다. Teams Workflows 앱 허용과 해당 채널 게시 권한도 점검하세요."],["실습 종료 방법도 정하세요","만든 흐름은 이름 앞에 EDU_를 붙입니다. 교육이 끝나면 흐름을 끄고 예약 실행이 남지 않았는지 확인하세요. 테스트 게시물과 파일의 정리도 승인된 범위에서만 합니다."]],"checks":["실습 계정에서 포털과 Outlook 연결에 접근할 수 있다.","Teams 테스트 채널 또는 메일 대체 실습 방식을 정했다.","실제 업무자료를 사용하지 않기로 했다."],"errors":[["프리미엄 체험을 시작하라는 화면이 보여요.","이번 기초 실습에 꼭 필요한 기능인지 먼저 확인하세요. 프리미엄 커넥터·AI Builder는 기본 실습에서 제외하며, 결제나 체험 등록을 유도하지 않습니다."],["조직에서 연결을 차단했어요.","다른 계정으로 우회하지 마세요. 관리자에게 커넥터 이름과 오류 화면을 전달하고, 사이트 내 가상 연습으로 전환하세요."]],"sources":["license","licensefaq","teams"]},{"id":"first-mail","n":"03","title":"버튼 한 번으로 나에게 메일 보내기","subtitle":"처음 만드는 흐름은 작고 확실하게, 수신자는 본인만.","tag":"첫 실습","icon":"mail","time":"10분","part":"cloud","goal":"수동 실행 흐름을 만들고 실제 결과와 실행 기록을 확인할 수 있어요.","prepare":["Office 365 Outlook 연결 가능 여부 확인","본인 회사 메일 주소 확인. 이 사이트에는 주소를 입력하지 않습니다."],"steps":[["인스턴트 클라우드 흐름을 만드세요","포털에서 만들기 → 인스턴트 클라우드 흐름을 선택합니다. 이름은 <code>EDU_01_나에게메일</code>. 트리거는 <strong>Manually trigger a flow</strong>(수동으로 흐름 트리거)를 선택하세요. 디자이너에 따라 메뉴 위치·한국어 번역은 달라질 수 있어요."],["Office 365 Outlook 액션을 추가하세요","새 단계/작업 추가에서 <strong>Office 365 Outlook</strong>을 검색하고 <strong>Send an email (V2)</strong>(전자 메일 보내기 V2)를 선택합니다. Outlook.com이나 Deprecated(사용 중단) 액션을 선택하지 않도록 주의하세요."],["세 칸만 채우세요","받는 사람(To)은 <strong>본인 회사 주소</strong>, 제목(Subject)은 <code>[자동화실습] 첫 번째 메일</code>, 본문(Body)은 “이 메일은 교육용 테스트입니다.”로 입력하세요. From·참조·숨은 참조·첨부는 비워 둡니다."],["저장하고 수동으로 테스트하세요","저장 후 테스트/실행에서 수동 실행을 선택합니다. 저장은 설계도를 보관하는 것이고, 실행은 실제 메일을 보내는 것이에요. 실행 버튼을 여러 번 누르면 여러 통 발송될 수 있습니다."],["결과를 두 군데에서 확인하세요","흐름의 실행 기록에서 트리거와 메일 액션이 성공했는지 확인하고, 본인 받은편지함에서 해당 테스트 메일을 찾으세요. 필요하면 스팸/정크 폴더도 확인합니다."],["흐름을 끄고 실습을 마치세요","테스트가 끝났으면 흐름 목록/상세 화면에서 해당 흐름을 끕니다. 본인이 만든 EDU_ 흐름만 다루세요."]],"checks":["수신자가 본인 한 명인지 실행 전에 확인했다.","실행 기록에서 메일 액션의 성공을 확인했다.","본인 받은편지함에서 테스트 메일을 확인했다."],"errors":[["저장했는데 메일이 오지 않아요.","수동 실행 흐름은 저장만 해서는 보내지 않습니다. 한 번 실행한 뒤 실행 기록을 확인하세요."],["보낸 사람 권한 오류가 나요.","From을 지정했다면 비워 두세요. 다른 사서함으로 보내려면 별도 Send As/Send on behalf 권한이 필요할 수 있습니다."],["메일이 여러 통 도착했어요.","실행 횟수를 확인하세요. 중복 클릭이나 반복 테스트는 각각 실제 발송입니다."]],"sources":["triggers","outlook"]},{"id":"mail-teams","n":"04","title":"교육용 메일이 오면 Teams에 알리기","subtitle":"트리거와 액션을 연결하는 오늘의 핵심 실습입니다.","tag":"핵심 실습","icon":"teams","time":"20분","part":"cloud","goal":"새 메일을 조건으로 받아 지정한 교육용 Teams 채널에 알릴 수 있어요.","prepare":["승인된 Teams 표준 테스트 채널과 게시 권한","Teams Workflows 앱 사용 허용 여부 확인","막히면 본인에게 메일 보내기로 대체하되 출력 제목은 [교육결과] 알림 확인으로 고정하여 재귀 발송 방지"],"steps":[["자동화된 클라우드 흐름을 만드세요","이름은 <code>EDU_02_메일알림</code>. Office 365 Outlook의 <strong>When a new email arrives (V3)</strong>(새 전자 메일이 도착하는 경우 V3)를 트리거로 고릅니다. 이전 실습의 수동 트리거와 다릅니다."],["받을 메일의 범위를 좁히세요","Folder는 실제 메일이 들어오는 받은편지함(Inbox)을 선택하고 Subject Filter는 <code>[자동화실습]</code>으로 설정합니다. 필요하면 From도 본인 주소로 제한하세요. 제목을 제한하지 않으면 일반 업무메일까지 처리할 수 있어요."],["Teams 메시지 액션을 추가하세요","Microsoft Teams의 <strong>Post message in a chat or channel</strong>(채팅 또는 채널에 메시지 게시)를 선택합니다. Post as는 Flow bot, Post in은 Channel로 설정하고 교육용 Team과 Channel을 선택하세요. <strong>이 액션의 비공개 채널 게시는 지원되지 않으므로 표준 테스트 채널을 사용합니다.</strong>"],["메시지에 필요한 정보만 넣으세요","“교육용 메일이 도착했습니다.”라는 안내 아래 트리거의 Subject(제목)와 From(보낸 사람) 동적 콘텐츠를 넣습니다. Subject라는 단어를 직접 쓰는 것이 아니라 이전 단계의 값을 선택하는 거예요. 메일 본문 전체와 첨부는 게시하지 않습니다."],["저장한 뒤 새 메일로 시험하세요","저장하고 흐름이 켜졌는지 확인한 후, 본인에게 <code>[자동화실습] 자료 확인 요청</code>이라는 새 메일을 한 통 보냅니다. 이미 도착한 옛 메일은 새 메일 트리거 시험용이 아니에요. 트리거 처리에 지연이 있을 수 있습니다."],["Teams와 실행 기록을 확인하세요","지정한 교육용 채널에서 제목·보낸 사람이 표시되는지 확인합니다. 실행 기록에서 트리거와 Teams 액션의 결과도 확인하세요. 다른 제목의 새 메일로 시험하면 필터 때문에 새 실행 자체가 생기지 않을 수 있어요."],["끝나면 흐름을 끄세요","교육 뒤 일반 메일이 처리되지 않도록 흐름을 끕니다. Teams가 막혀 본인 메일로 대체한다면, 받는 사람은 본인 한 명, 제목은 반드시 <code>[교육결과] 알림 확인</code>처럼 트리거 필터 [자동화실습]과 <strong>일치하지 않는 고정 문구</strong>로 설정하세요. 수신 제목을 발송 제목에 그대로 넣거나 [자동화실습]을 붙이면 자기 메일을 다시 처리해 반복 발송될 수 있습니다. 받은 제목 동적 콘텐츠는 본문에만 넣고, 출력 메일이 새 실행을 만들지 않는지 확인한 뒤 흐름을 끕니다."]],"checks":["Subject Filter가 [자동화실습]으로 제한되어 있다.","승인된 표준 테스트 채널 또는 본인 메일 대안을 사용했다.","새 메일로 시험하고 실제 알림과 실행 기록을 확인했다.","실습 종료 후 흐름을 껐다.","본인 메일 대체 시 발송 제목이 트리거 필터와 일치하지 않음을 확인했다."],"errors":[["팀/채널 목록이 안 보여요.","연결 계정과 팀 멤버십·게시 권한을 확인하세요. Workflows 앱 허용 여부는 조직 관리자에게 문의합니다."],["새 메일을 보냈는데 실행 기록이 없어요.","흐름 켜짐, 제목 필터, 트리거 폴더를 순서대로 확인하세요. Outlook 규칙이 다른 폴더로 옮기는지도 확인합니다."],["Teams가 막혀 진행할 수 없어요.","액션을 Office 365 Outlook Send an email (V2)로 바꾸고 받는 사람은 본인, 발송 제목은 [교육결과] 알림 확인으로 고정하세요. 입력 필터 [자동화실습]과 일치하지 않아야 합니다. 받은 제목은 본문에만 넣어 자기 메일의 재귀 발송을 막고, 종료 후 흐름을 끕니다."]],"sources":["outlook","teams","teamshow"]},{"id":"attachments","n":"05","title":"메일 첨부를 SharePoint에 모으기","subtitle":"복사해서 옮기던 작은 반복 작업을 흐름으로 바꿉니다.","tag":"SharePoint","icon":"folder","time":"20분","part":"cloud","goal":"가상 첨부파일을 승인된 테스트 폴더에 저장하는 흐름을 구성할 수 있어요.","prepare":["승인된 테스트 SharePoint 문서 라이브러리와 쓰기 권한","실습자료의 sample-notice.txt 등 작은 가상 첨부 1개"],"steps":[["먼저 저장 위치를 정하세요","SharePoint의 기존 문서 라이브러리 안에 승인된 테스트 폴더를 준비합니다. 본인이 업로드·확인할 수 있는지 수동으로 먼저 점검하세요. 실제 공용 업무 폴더를 대상으로 하지 않습니다."],["새 메일 V3 트리거를 제한하세요","새 흐름 <code>EDU_03_첨부저장</code>에 When a new email arrives (V3)를 추가합니다. 제목 필터는 <code>[자동화실습-첨부]</code>, Only with Attachments는 Yes로 설정합니다. 소량의 작은 가상 첨부 실습에서는 Include Attachments도 Yes로 설정합니다."],["첨부 배열을 반복하세요","<strong>Apply to each</strong>(각각에 적용)를 추가하고 트리거의 Attachments(첨부 배열)를 선택합니다. 서명 로고 같은 인라인 첨부는 IsInline이 false인 항목만 처리하도록 조건을 추가하세요."],["반복 안에 SharePoint 파일 만들기를 넣으세요","SharePoint <strong>Create file</strong>(파일 만들기)에서 Site Address와 Folder Path를 테스트 위치로 지정합니다. File Name에는 현재 첨부의 Name, File Content에는 현재 첨부의 Content/Content Bytes에 해당하는 콘텐츠 값을 넣으세요. 이름·ID는 파일 내용이 아닙니다."],["새 가상 메일로 확인하세요","이전 실행과 겹치지 않는 고유한 파일명을 사용하고, 작은 텍스트 파일 1개를 첨부한 새 테스트 메일을 보냅니다. 실행 기록, 저장 위치, 파일명, 실제 파일 내용을 확인하세요. 이 예제는 악성코드 검사나 보안 검증을 대신하지 않습니다."],["업무 적용 전에 중복과 대량 수신을 설계하세요","같은 이름의 파일과 재실행을 어떻게 처리할지 정하세요. 첨부가 많으면 Include Attachments를 No로 두고 반복 내부에서 Get Attachment (V2)에 메일 ID와 첨부 ID를 전달해 콘텐츠를 받는 방식도 검토합니다. 첫 실습과 운영 설계를 혼동하지 마세요."]],"checks":["대상이 실제 업무 폴더가 아닌 승인된 테스트 폴더다.","파일 이름과 파일 콘텐츠를 구분했다.","저장된 파일의 실제 내용까지 확인했다."],"errors":[["파일은 생겼는데 열리지 않아요.","File Content에 이름이나 첨부 ID를 넣지 않았는지 확인하세요. 실제 첨부 콘텐츠를 전달해야 합니다."],["목록 항목 ID를 요구해요.","SharePoint의 Add attachment를 선택한 것인지 확인하세요. 이번 실습은 문서 라이브러리에 Create file을 쓰는 예제입니다."],["파일이 중복되거나 덮어쓰기 문제가 생겨요.","자동 중복 처리가 구현된 예제가 아닙니다. 교육은 고유한 파일명으로 실행하고, 업무 적용 때 파일명·충돌 처리 규칙을 별도 설계하세요."]],"sources":["outlook","sharepoint","attach"]},{"id":"excel","n":"06","title":"엑셀의 미완료 업무를 한 번에 알리기","subtitle":"온라인 엑셀은 워크시트가 아니라 ‘테이블’을 선택합니다.","tag":"Excel","icon":"table","time":"25분","part":"cloud","goal":"실습용 Excel 테이블의 미완료 행만 모아 본인에게 요약 메일을 보낼 수 있어요.","prepare":["실습자료 sample-tasks.xlsx 다운로드","비즈니스용 OneDrive 또는 SharePoint 테스트 폴더와 편집 권한"],"steps":[["실습 파일을 업로드하고 표를 확인하세요","sample-tasks.xlsx를 승인된 비즈니스용 OneDrive 또는 SharePoint 테스트 폴더에 업로드합니다. 파일의 업무목록 시트에는 <code>Tasks</code>라는 Excel 테이블이 이미 있어요. 테두리가 있는 셀 범위와 Excel 테이블은 다릅니다."],["처음에는 수동 실행으로 만드세요","인스턴트 클라우드 흐름 <code>EDU_04_미완료업무</code>에 Manually trigger a flow를 선택합니다. 예약 실행으로 바로 시작하지 않아야 반복 발송을 피할 수 있어요."],["테이블의 행을 읽으세요","Excel Online (Business)의 <strong>List rows present in a table</strong>(테이블에 있는 행 나열)에 위치·문서 라이브러리·파일·테이블 Tasks를 지정합니다. 로컬 C: 경로를 넣는 액션이 아닙니다. 이 파일은 5행이라 기본 범위 안에 있지만 기본 반환은 최대 256행이므로 큰 자료는 페이지 매김 설정을 검토해야 해요."],["미완료 행을 필터링하세요","데이터 작업(Data Operations)의 <strong>Filter array</strong>(배열 필터링)를 추가합니다. From은 행 나열의 <code>value</code> 배열, 조건은 각 행의 <code>Status</code>가 <code>완료</code>와 같지 않음입니다. UI에서 항목의 열을 고르기 어렵다면 식 <code>item()?['Status']</code>를 왼쪽 값으로 사용합니다. “진행중”과 “미시작” 3행이 남는 것이 이 자료의 기대 결과예요."],["한 통의 요약 메일로 만드세요","Create HTML table(HTML 테이블 만들기)에 Filter array의 Body(필터링된 배열)를 넣고 열은 우선 Automatic으로 둡니다. 다음 Office 365 Outlook Send an email (V2)의 <strong>받는 사람은 본인 한 명</strong>, <strong>제목은 <code>[교육결과] 미완료 업무 요약</code></strong>, 본문은 HTML 테이블 출력으로 지정합니다. 제목에 [자동화실습]을 넣지 않아 다른 교육 흐름을 불필요하게 시작하지 않도록 하세요. From·CC·BCC는 비워 두고, 행마다 보내는 반복문 대신 한 통으로 요약합니다."],["테스트하고 결과를 비교하세요","저장 후 한 번 실행합니다. 수신 메일에 미완료 업무 3건이 들어 있는지 확인하세요. Excel 화면의 필터가 커넥터에도 자동 적용된다고 생각하면 안 됩니다. 이 예제는 상태만 필터링하며 마감일 계산은 하지 않습니다."],["운영 전에 동시 수정과 날짜를 점검하세요","Excel 커넥터는 동시 수정을 지원하지 않습니다. 다른 흐름·Excel 웹·PC용 Excel이 같은 파일에 동시에 쓰지 않도록 하세요. 마감일 확장 실습은 날짜 형식·빈 값·시간대·반복 알림 방지 규칙을 먼저 정한 뒤 추가합니다."]],"checks":["워크시트와 Excel 테이블 Tasks를 구분했다.","미완료 3행이 포함된 요약 메일 한 통을 본인에게 보냈다.","페이지 매김과 동시 수정 제한을 이해했다."],"errors":[["테이블 목록이 비어 있어요.","실제 Excel 테이블인지, 비즈니스용 저장 위치인지, 올바른 파일인지 확인하세요. 샘플은 Tasks 테이블이 있습니다."],["전체가 아닌 일부 행만 조회돼요.","기본 256행 반환과 액션 설정의 Pagination(페이지 매김)을 확인하세요. 256은 파일의 최대 행 수가 아닙니다."],["Excel 파일이 잠겼거나 쓰기가 실패해요.","동시에 파일을 수정하는 앱·흐름을 확인하세요. 공식 제한상 커넥터 사용 후 일정 시간 잠금이 남을 수 있습니다."]],"sources":["excel","outlook"]},{"id":"logic","n":"07","title":"조건·반복·변수, 세 가지만 이해하기","subtitle":"어려운 용어를 업무 문장으로 바꾸면 훨씬 쉽습니다.","tag":"기초 개념","icon":"branch","time":"10분","part":"basic","goal":"조건과 반복이 필요한 상황을 구분하고 동적 콘텐츠를 이해할 수 있어요.","prepare":["첫 메일 실습 또는 메일 → Teams 실습을 먼저 읽어 보세요."],"concepts":[["조건 Condition","“상태가 완료가 아니면 알린다”처럼 맞는 경우와 아닌 경우를 나눕니다."],["반복 Apply to each","첨부파일이 3개라면 각 첨부마다 파일 저장을 한 번씩 합니다."],["변수 Variable","진행 중 바뀔 값을 이름을 붙여 보관합니다. 예: 처리 건수."],["동적 콘텐츠 Dynamic content","앞 단계에서 받은 실제 값을 뒤 단계에 넣습니다. 예: 방금 도착한 메일 제목."]],"steps":[["조건을 일상 문장으로 써 보세요","“긴급이면 담당자에게 알림”의 ‘긴급인가?’가 조건입니다. 제목 필터처럼 트리거에서 범위를 좁히는 것과, 실행 후 조건 분기로 나누는 것은 다릅니다."],["한 개와 여러 개를 구분하세요","메일 한 통에도 첨부는 여러 개일 수 있어요. 배열을 선택하면 디자이너가 반복을 자동으로 추가하기도 합니다. 반복 안의 액션은 항목 수만큼 실행되므로 실제 발송 횟수를 확인하세요."],["고정 문구와 동적 값을 구분하세요","본문에 “Subject”라고 직접 쓰면 그 단어가 나옵니다. 새 메일 트리거의 Subject 동적 콘텐츠를 선택해야 도착한 메일 제목이 들어가요."],["복잡해지기 전에 종이에 그리세요","시작 → 조건 → 작업 → 결과 확인을 먼저 적습니다. 식을 복사하기 전에 입력 값과 기대 결과를 설명할 수 있어야 합니다."]],"checks":["조건과 트리거 필터의 차이를 이해했다.","반복 안의 메일 액션이 여러 번 발송될 수 있음을 이해했다.","고정 문구와 동적 콘텐츠를 구분할 수 있다."],"errors":[["자동으로 Apply to each가 생겼어요.","여러 항목을 가진 배열을 선택했는지 확인하세요. 없애기 전에 액션이 한 항목용인지 여러 항목용인지부터 파악합니다."]],"sources":["triggers","cloud","outlook"]},{"id":"troubleshoot","n":"08","title":"실패했을 때는 실행 기록부터","subtitle":"무작정 다시 실행하기보다, 어디까지 처리됐는지 확인합니다.","tag":"오류 해결","icon":"activity","time":"5분","part":"operation","goal":"실행 기록에서 실패 위치를 찾고 안전하게 재시험할 수 있어요.","prepare":["만든 EDU_ 흐름 1개","오류 화면을 공유할 때 계정·메일·내부 주소를 가릴 준비"],"steps":[["실행 기록이 있는지 확인하세요","포털의 내 흐름에서 해당 흐름을 선택하고 실행 기록을 확인합니다. 기록 자체가 없다면 흐름 켜짐, 새 이벤트 발생 여부, 제목 필터, 선택한 메일 폴더부터 확인하세요. 메뉴 이름은 디자이너에 따라 다를 수 있습니다."],["첫 실패 단계부터 보세요","기록이 있다면 실패·건너뜀·성공을 구분합니다. 입력·출력의 연결 계정, 대상 폴더/채널, 필수 값, 오류 코드를 확인하세요. 로그에는 실제 메일과 개인정보가 들어갈 수 있으므로 공개 저장소에 복사하지 않습니다."],["권한 오류와 데이터 오류를 나누세요","연결 만료·접근 거부·게시 권한은 계정/조직 설정 문제일 수 있습니다. 빈 값·잘못된 파일 경로·이름을 콘텐츠에 넣은 실수는 데이터/설정 문제일 수 있어요. 정책 차단을 우회하지 마세요."],["재실행 전에 이미 처리된 일을 확인하세요","메일이 발송됐거나 파일이 저장된 다음 단계에서 실패했을 수 있습니다. 처음부터 다시 실행하면 중복 발송·중복 저장이 생길 수 있어요. 작은 가상 데이터로 새 테스트를 하고 결과를 비교합니다."],["흐름을 끄고 변경점을 기록하세요","종료 후 흐름을 끕니다. 무엇이 실패했는지, 무엇을 바꿨는지, 새 시험의 결과가 어땠는지만 개인정보 없이 기록하세요. 성공 표시와 실제 업무 결과는 둘 다 확인해야 합니다."]],"checks":["실행 기록이 없는 경우와 중간 실패를 구분한다.","재실행 전에 이미 처리된 작업을 확인한다.","실제 결과와 실행 기록을 함께 확인한다."],"errors":[["계속 실행 버튼을 누르면 해결되나요?","아니요. 원인을 그대로 두면 중복 작업만 늘어날 수 있습니다. 실패 지점을 먼저 확인하세요."]],"sources":["cloud","outlook","excel"]},{"id":"business","n":"09","title":"내 업무에 적용하기 전 7가지 질문","subtitle":"작동하는 흐름과 운영 가능한 흐름은 다릅니다.","tag":"업무 적용","icon":"check","time":"5분","part":"operation","goal":"작은 자동화 후보를 고르고 운영 전 점검할 수 있어요.","prepare":["자동화할 업무 한 가지","팀의 데이터 취급·공유·운영 정책"],"steps":[["규칙과 담당자를 정하세요","① 시작 조건·입력·예외가 명확한가? ② 흐름과 연결의 책임자가 정해져 있는가? 휴직·퇴사·담당 변경 때 연결과 소유권을 어떻게 관리할지도 정합니다."],["대상과 권한을 줄이세요","③ 필요한 최소 데이터·수신자·저장 위치만 쓰는가? 공유 흐름에서는 누가 어떤 연결로 실행하는지 확인합니다. 비밀번호·토큰·인증코드를 코드나 메모에 적지 마세요."],["중복과 실패를 설계하세요","④ 같은 이벤트를 다시 처리하면 어떻게 되는가? ⑤ 중간 실패를 누가 알아차리고 어떻게 복구하는가? 메일 발송·파일 생성·상태 변경 전에 식별자와 중복 방지 방안을 검토하세요. 특히 새 메일을 받아 다시 메일을 보내는 흐름은 출력 메일이 입력 필터와 일치하지 않는지 확인하여 자기 자신을 반복 호출하는 루프를 막으세요."],["비용과 변경에 대비하세요","⑥ 커넥터·라이선스·호출 한도·실행 빈도를 확인했는가? ⑦ 테스트·중지·인수인계 방법이 있는가? 조직 담당자의 검토 없이 유료 기능이나 대량 예약 실행으로 확장하지 않습니다."],["후보를 작은 단위로 적으세요","업무명 / 현재 수작업 / 시작 조건 / 처리 규칙 / 결과 위치 / 실패 시 담당자 / 승인 필요사항을 한 장에 적어 보세요. 첫 후보는 ‘실행 전에 내가 확인할 수 있고 실패해도 복구하기 쉬운 작업’이 좋아요."]],"checks":["자동화 책임자와 결과 확인 방법을 정했다.","수신자·저장 위치·권한을 최소화했다.","중복 처리·실패 복구·중지 방법을 검토했다."],"errors":[["작동하니까 바로 전사에 배포해도 되나요?","개인 테스트 성공은 운영·보안·권한 검증 완료를 의미하지 않습니다. 업무 책임자와 조직 정책을 먼저 확인하세요."]],"sources":["license","licensefaq"]},{"id":"review","n":"10","title":"복습: 작은 자동화 하나로 시작하기","subtitle":"기능을 외우기보다, 설명하고 확인할 수 있으면 됩니다.","tag":"마무리","icon":"book","time":"5분","part":"operation","goal":"배운 내용을 정리하고 다음 학습 경로를 고를 수 있어요.","prepare":["기초 용어와 첫 실습 내용을 떠올려 보세요."],"steps":[["오늘 배운 흐름을 설명해 보세요","수동 트리거 → 본인에게 메일 / 새 메일 트리거 → 제목 필터 → Teams 알림. 각각 언제 시작하고 무슨 일을 하는지 소리 내어 설명해 보세요."],["실습 종료를 확인하세요","본인 EDU_ 흐름이 꺼져 있는지, 원치 않는 예약·자동 실행이 남지 않았는지 확인합니다. 교육용 파일·게시물 정리는 승인된 범위 안에서만 합니다."],["이해도 체크를 해 보세요","사이트의 ‘이해도 체크’에서 쉬운 10문제를 풀어 보세요. 답을 고르면 바로 짧은 해설이 나옵니다. 틀려도 괜찮아요. 관련 레슨을 다시 읽고 언제든 다시 풀 수 있어요. 점수는 공식 수료 인증이 아니며 계정으로 전송되지 않습니다."],["다음 경로를 선택하세요","메일 업무가 많다면 SharePoint 첨부 저장, 목록 관리가 많다면 Excel 요약을 선택하세요. 동시에 여러 자동화를 만들기보다 하나를 안정적으로 검증하고, 연결 권한·실행 기록·중복 방지를 확인하세요."]],"checks":["만든 흐름의 종료 상태를 확인했다.","다음에 공부할 실습 하나를 골랐다.","실제 업무 적용은 별도 승인·검증이 필요함을 이해했다."],"errors":[["사이트의 완료 체크가 회사에 보고되나요?","아니요. 이 사이트의 학습 완료 기록은 현재 브라우저의 로컬 저장소에만 저장됩니다. 공식 수료·출결 시스템이 아닙니다."]],"sources":["types","license"]}],"agenda":[{"range":"00–10","label":"이해와 준비","title":"자동화의 원리를 알고, 안전하게 준비해요","desc":"익숙한 업무 사례로 클라우드 흐름의 트리거·액션·서비스 연결을 이해합니다.","lessons":["start","prepare"]},{"range":"10–20","label":"첫 성공 경험","title":"버튼으로 나에게 테스트 메일 보내기","desc":"세 칸만 채운 작은 흐름으로 저장·실행·결과 확인을 익힙니다.","lessons":["first-mail"]},{"range":"20–40","label":"핵심 실습","title":"메일 수신 → 교육용 Teams 알림","desc":"제목 필터와 동적 콘텐츠를 써서 두 서비스를 연결합니다.","lessons":["mail-teams"]},{"range":"40–50","label":"업무로 확장","title":"SharePoint·Excel 클라우드 활용 맛보기","desc":"이 시간은 두 가지를 모두 만드는 실습이 아니라, 결과와 활용 사례를 보는 시연입니다.","lessons":["attachments","excel"]},{"range":"50–60","label":"확인과 마무리","title":"실행 기록을 보고, 내 업무 하나 고르기","desc":"흐름을 끄고, 오류 확인 방법과 업무 적용 전 체크리스트를 살펴봅니다.","lessons":["troubleshoot","business","review"]}],"glossary":[["자동화","Automation","반복되는 일을 정해진 규칙에 따라 처리하는 것. 판단·승인까지 무조건 맡긴다는 뜻은 아닙니다."],["흐름","Flow","시작 조건과 작업을 순서대로 연결한 자동화의 단위."],["트리거","Trigger","흐름을 시작시키는 사건. 새 메일 도착, 버튼 클릭, 정해진 시간 등이 있어요."],["액션","Action","흐름 안에서 수행할 작업. 메일 보내기, 파일 만들기 등이에요."],["커넥터","Connector","Outlook·Teams 같은 서비스와 Power Automate를 연결하는 기능 모음."],["연결","Connection","어떤 계정과 권한으로 커넥터를 사용할지 정한 실제 인증 연결."],["동적 콘텐츠","Dynamic content","앞 단계의 실행 결과를 뒤 단계에 넣는 값. 예: 새 메일의 제목."],["조건","Condition","참·거짓에 따라 다음 행동을 나누는 규칙."],["배열","Array","여러 항목을 담은 목록. 첨부파일 여러 개나 Excel의 여러 행이 예입니다."],["반복","Apply to each","목록에 있는 각 항목에 같은 작업을 적용하는 것."],["변수","Variable","실행 중 값을 이름 붙여 보관하는 공간."],["환경","Environment","흐름과 데이터 등을 구분해서 관리하는 Power Platform의 작업 공간."],["표준·프리미엄","Standard / Premium","커넥터의 라이선스 분류. 표준이어도 회사 권한·정책 확인은 필요해요."],["테이블","Excel table","머리글과 이름이 있는 Excel의 구조화된 표. 워크시트 전체나 단순 테두리와 달라요."],["실행 기록","Run history","흐름이 언제 실행되고 각 단계에서 어떤 결과가 났는지 확인하는 기록."],["클라우드 흐름","Cloud flow","Outlook·Teams·SharePoint 같은 온라인 서비스를 커넥터로 연결하는 자동화. 이벤트·버튼·일정에 따라 시작할 수 있어요."]],"faq":[["메일이 오지 않거나 Teams 알림이 안 와요.","먼저 실행 기록이 생겼는지 확인하세요. 없으면 흐름 켜짐·새 메일·제목 필터·실제 수신 폴더를 점검합니다. 기록이 있으면 첫 실패 단계의 연결·권한·대상·필수 값을 확인하세요. 트리거 지연 가능성도 고려합니다. 본인 메일 대체안은 발송 제목을 [교육결과] 알림 확인으로 고정하고, 입력 필터 [자동화실습]과 일치하지 않게 해 반복 발송을 막으세요.","troubleshoot"],["Teams에서 채널을 선택할 수 없어요.","연결 계정, 팀 멤버십, 게시 권한, Workflows 앱 허용 여부를 확인합니다. 이번 메시지 액션은 비공개 채널을 대상으로 하지 않습니다. 승인된 표준 채널 또는 본인 메일 대체 실습을 사용하세요. 본인 메일 대체 시 출력 제목은 [교육결과] 알림 확인으로 고정하며 입력 제목 필터와 일치하면 안 됩니다.","mail-teams"],["회사 Microsoft 365를 쓰면 전부 무료인가요?","아니요. 이 사이트의 기본 예제는 표준 커넥터 중심이지만, 사용자에게 할당된 사용 권한·환경·조직 정책은 별도 확인이 필요합니다. 프리미엄 커넥터나 AI Builder 등의 유료 기능까지 포함된다고 가정하지 마세요.","prepare"],["엑셀 파일은 있는데 테이블이 안 보여요.","파일이 지원되는 비즈니스용 저장 위치에 있는지 확인하고, Excel의 삽입→표 기능으로 테이블을 만들었는지 확인하세요. 실습용 파일에는 Tasks 테이블이 미리 들어 있습니다.","excel"],["조회 결과가 256행에서 끝나요.","List rows present in a table의 기본 반환은 최대 256행입니다. 256은 파일 최대 행 수가 아닙니다. 액션 설정의 Pagination을 켜고 필요한 범위와 반환 결과를 검증하세요.","excel"],["다시 실행하면 같은 메일이 또 보내지나요?","그럴 수 있습니다. 성공한 앞 단계가 있는데 뒤에서 실패했을 수도 있어요. 재실행 전에 발송·저장 결과를 확인하고 운영에서는 식별자와 중복 방지를 설계하세요.","business"],["사이트에서 실제 Power Automate를 실행하나요?","아니요. 가상 연습은 이 브라우저 안에서 준비된 예시를 보여 주는 시뮬레이션입니다. 계정 로그인·실제 발송·파일 업로드·PC 제어는 하지 않습니다.","start"],["진도가 다른 PC에도 이어지나요?","현재 브라우저의 로컬 저장소에만 보관됩니다. 동기화·출결 보고·공식 수료 인증은 제공하지 않습니다. 브라우저 데이터 삭제나 다른 브라우저 사용 시 기록이 없을 수 있어요.","review"]],"quiz":[{"q":"Power Automate는 주로 어떤 일을 도와줄까요?","a":["반복하는 일을 정한 순서대로 처리하기","컴퓨터 화면 색 바꾸기","회사 규칙을 없애기"],"correct":0,"why":"매번 반복하는 메일 보내기나 알림 같은 일을, 정해 둔 규칙에 따라 처리하도록 도와줘요.","lesson":"start"},{"q":"자동화를 시작하게 만드는 일을 무엇이라고 할까요?","a":["글꼴","트리거","첨부파일"],"correct":1,"why":"트리거는 시작 신호예요. 버튼 클릭이나 새 메일 도착이 시작 신호가 될 수 있어요.","lesson":"start"},{"q":"“메일이 오면 Teams에 알린다”에서 액션은 무엇일까요?","a":["메일이 오는 것","수업을 시작하는 것","Teams에 알리는 것"],"correct":2,"why":"액션은 시작한 뒤에 하는 일이에요. 이 예에서는 Teams에 알림을 보내는 것이 액션이에요.","lesson":"start"},{"q":"Outlook과 Power Automate를 연결하는 기능은 무엇일까요?","a":["커넥터","배경 화면","글자 크기"],"correct":0,"why":"커넥터는 서비스를 연결해 주는 기능이에요. Outlook 커넥터로 메일을 읽거나 보낼 수 있어요.","lesson":"prepare"},{"q":"첫 테스트 메일은 누구에게 보내는 것이 안전할까요?","a":["전체 직원","나 자신","모든 고객"],"correct":1,"why":"처음에는 본인 한 명에게만 보내요. 실수하더라도 다른 사람에게 영향을 주지 않도록 연습해요.","lesson":"first-mail"},{"q":"버튼으로 실행하는 흐름을 저장했어요. 테스트하려면 다음에 무엇을 할까요?","a":["아무것도 하지 않기","실행 버튼을 계속 누르기","받는 사람을 확인하고 한 번 실행하기"],"correct":2,"why":"저장은 만든 흐름을 보관하는 것이에요. 테스트하려면 한 번 실행하고 실제 결과를 확인해요.","lesson":"first-mail"},{"q":"제목에 [자동화실습]이 있는 메일만 알리고 싶어요. 무엇을 정하면 될까요?","a":["제목 필터","모니터 밝기","글자 색"],"correct":0,"why":"제목 필터는 원하는 메일만 골라 주는 조건이에요. 연습과 관계없는 메일은 처리하지 않도록 해요.","lesson":"mail-teams"},{"q":"교육 실습에는 어떤 자료를 사용하는 것이 좋을까요?","a":["실제 고객의 개인정보","준비된 가상 연습 자료","중요한 계약 원본"],"correct":1,"why":"가상 자료로 안전하게 연습해요. 실제 고객 정보나 중요한 회사 자료는 사용하지 않아요.","lesson":"prepare"},{"q":"흐름이 잘 실행됐는지 확인할 때 살펴볼 곳은 어디일까요?","a":["컴퓨터 바탕화면","글꼴 설정","실행 기록"],"correct":2,"why":"실행 기록에서 성공했는지, 어느 단계에서 문제가 생겼는지 볼 수 있어요. 받은 메일 같은 실제 결과도 함께 확인해요.","lesson":"troubleshoot"},{"q":"교육이 끝나고 연습용 자동 알림이 더는 필요 없어요. 어떻게 할까요?","a":["연습용 흐름을 끄기","계속 켜 두기","똑같은 흐름을 하나 더 만들기"],"correct":0,"why":"연습용 흐름을 꺼 두면 원하지 않는 메일이나 알림이 나가는 것을 막을 수 있어요.","lesson":"review"}]};

function quiz(){let html=intro('CHECK YOUR UNDERSTANDING','이해했는지, 가볍게 확인해요.','쉬운 '+DATA.quiz.length+'문제로 차근차근 복습해요. 답을 고르면 바로 해설이 나와요. 틀려도 괜찮아요. 점수는 서버로 전송되지 않습니다.');if(quizIndex>=DATA.quiz.length){const correct=quizAnswers.filter((a,i)=>a===DATA.quiz[i].correct).length;return html+'<div class="quiz-container"><div class="card quiz-score"><div class="eyebrow" style="justify-content:center">NICE FIRST STEP</div><h2>복습을 마쳤어요.</h2><strong>'+correct+'<span style="font-size:22px;color:#a2b0c3"> / '+DATA.quiz.length+'</span></strong><p>틀린 문제는 관련 레슨을 다시 읽어 보세요.<br>중요한 건 안전하게 설명하고 확인할 수 있는 거예요.</p><div class="buttons" style="justify-content:center"><button class="btn primary" id="quiz-restart">다시 풀기</button><a class="btn" href="#course">코스 돌아보기</a></div></div><div class="spacer"></div>'+DATA.quiz.map((q,i)=>'<div class="card" style="margin-bottom:12px"><span class="tag '+(quizAnswers[i]===q.correct?'green':'orange')+'">문제 '+(i+1)+' · '+(quizAnswers[i]===q.correct?'정답':'다시 보기')+'</span><h3 style="font-size:14px;margin-top:10px">'+q.q+'</h3><p>'+q.why+'</p><div style="margin-top:12px">'+lessonLink(q.lesson,'관련 레슨')+'</div></div>').join('')+'</div>'}const q=DATA.quiz[quizIndex];const answered=quizAnswers[quizIndex]!==undefined;return html+'<div class="quiz-container"><div class="article-card"><div class="quiz-count">QUESTION '+String(quizIndex+1).padStart(2,'0')+' / '+String(DATA.quiz.length).padStart(2,'0')+'</div><div class="progress-track" style="margin-bottom:25px;height:4px"><div class="progress-fill" style="width:'+(quizIndex/DATA.quiz.length*100)+'%"></div></div><h2 style="font-size:21px">'+q.q+'</h2>'+q.a.map((a,i)=>'<button class="quiz-choice '+(answered?(i===q.correct?'correct':i===quizAnswers[quizIndex]?'wrong':''):'')+'" data-answer="'+i+'" '+(answered?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+a+'</button>').join('')+(answered?'<div class="quiz-explanation" role="status"><strong>'+(quizAnswers[quizIndex]===q.correct?'맞았어요.':'괜찮아요, 이렇게 기억해 보세요.')+'</strong>< function render(keepScroll=false){const bits=location.hash.replace(/^#/,'').split('/');const route=bits[0]||'home';currentRoute=route;currentLesson=route==='lesson'?(bits[1]||''):'';let view;try{switch(route){case 'home':view=home();break;case 'discover':view=discovery();break;case 'course':view=course();break;case 'labs':view=labs();break;case 'lesson':view=lessonPage(currentLesson);break;case 'glossary':view=glossary();break;case 'help':view=help();break;case 'resources':view=resources();break;case 'quiz':view=quiz();break;case 'search':view=searchPage(decodeURIComponent(bits.slice(1).join('/')));break;default:view=notFound()}}catch(e){console.error(e);view=notFound()}$('#main').innerHTML=view+footer();const nav=route==='lesson'?'labs':route;document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===nav;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const label=route==='lesson'?(lessonBy(currentLesson)?.title||'레슨'):route==='search'?'학습 내용 검색':routeMap.find(r=>r[0]===route)?.[2]||'학습 홈';$('#crumb-current').textContent=label;document.title=label+' | Power Automate 첫걸음 · FLOW CLASS';closeMenu();bindView();updateTimer();if(!keepScroll){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}}
function bindView(){bindDiscovery();document.querySelectorAll('[data-download]').forEach(b=>b.addEventListener('click',()=>download(b.dataset.download)));document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{labFilter=b.dataset.filter;render(true)}));document.querySelectorAll('[data-anchor]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById(a.dataset.anchor)?.scrollIntoView({behavior:'smooth'})}));document.querySelectorAll('[data-check]').forEach(c=>c.addEventListener('change',()=>{const id=c.dataset.lesson;const n=Number(c.dataset.check);if(!Array.isArray(state.checks[id]))state.checks[id]=[];state.checks[id]=state.checks[id].filter(i=>i!==n);if(c.checked)state.checks[id].push(n);if(!c.checked&&done(id)){state.completed=state.completed.filter(x=>x!==id);$('#completion-note').innerHTML=''}persist();const b=$('#complete-lesson');if(b){b.disabled=!done(id)&&state.checks[id].length!==lessonBy(id).checks.length;b.classList.toggle('primary',!done(id));b.innerHTML=icon('check',14)+' '+(done(id)?'완료 기록 해제':'학습 완료로 표시')}}));$('#complete-lesson')?.addEventListener('click',e=>{const id=e.currentTarget.dataset.id;if(done(id)){state.completed=state.completed.filter(x=>x!==id);toast('학습 완료 기록을 해제했어요.')}else{if((state.checks[id]||[]).length!==lessonBy(id).checks.length)return;state.completed.push(id);toast('학습 완료로 기록했어요. 이 브라우저에만 저장됩니다.')}persist();render(true)});$('#expand-steps')?.addEventListener('click',e=>{const els=[...document.querySelectorAll('.step')];const open=els.some(d=>!d.open);els.forEach(d=>d.open=open);e.currentTarget.textContent=open?'모두 접기':'모두 펼치기'});$('#sim-email')?.addEventListener('change',e=>{const texts={match:'[자동화실습] 자료 확인 요청',skip:'이번 주 점심 메뉴 안내',match2:'[자동화실습] 가상 일정 확인'};$('#sim-subject').textContent=texts[e.target.value];$('#run-log').className='run-log';$('#run-log').textContent='메일을 선택했어요. 가상으로 실행해 보세요.'});$('#simulate')?.addEventListener('click',simulate);$('#reset-progress')?.addEventListener('click',()=>{if(confirm('이 브라우저의 학습 체크를 모두 초기화할까요? 실제 Power Automate 흐름은 변경되지 않습니다.')){state={completed:[],checks:{}};persist();render(true);toast('이 브라우저의 학습 기록을 초기화했어요.')}});document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(quizAnswers[quizIndex]!==undefined)return;quizAnswers[quizIndex]=Number(b.dataset.answer);render(true)}));$('#quiz-next')?.addEventListener('click',()=>{quizIndex++;render(true)});$('#quiz-restart')?.addEventListener('click',()=>{quizIndex=0;quizAnswers=[];render(true)});$('#timer-toggle')?.addEventListener('click',toggleTimer);$('#timer-reset')?.addEventListener('click',()=>{timerRunning=false;timerRemaining=3600000;timerDeadline=0;updateTimer()})}
function simulate(){const match=$('#sim-email').value!=='skip';const subject=$('#sim-subject').textContent;const log=$('#run-log');log.className='run-log active';log.innerHTML='<div class="log-row">'+icon('check',15)+'<div><b>가상 새 메일을 확인했어요.</b><small>교육용 예시 데이터 · 실제 수신 아님</small></div></div>'+(match?'<div class="log-row">'+icon('check',15)+'<div><b>제목 필터와 일치해요.</b><small>[자동화실습] 문자열이 포함되어 있어요.</small></div></div><div class="log-row">'+icon('teams',16)+'<div><b>가상 Teams 알림을 만들었어요.</b><div class="message-bubble">교육용 메일이 도착했습니다.<br>제목: '+escapeHTML(subject)+'<br>보낸 사람: 교육담당 A · 가상 인물</div></div></div>':'<div class="log-row">'+icon('help',15)+'<div><b style="color:#8c753e">필터가 맞지 않아 시작하지 않아요.</b><small>Teams 알림 없음 · 실제 서비스에서는 새 실행 기록이 생기지 않을 수 있어요.</small></div></div>')}
function download(name){const entry=MATERIALS[name];if(!entry){toast('자료를 찾지 못했어요.');return}const raw=atob(entry.base64);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:entry.mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(name+' 다운로드를 요청했어요.')}
let timerRemaining=3600000,timerRunning=false,timerDeadline=0;
function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,timerDeadline-Date.now());timerRunning=false}else{if(timerRemaining<=0)timerRemaining=3600000;timerDeadline=Date.now()+timerRemaining;timerRunning=true}updateTimer()}
function updateTimer(){if(timerRunning){timerRemaining=Math.max(0,timerDeadline-Date.now());if(timerRemaining<=0){timerRunning=false;toast('1시간 수업 타이머가 끝났어요. 만든 흐름을 껐는지 확인해 주세요.')}}const el=$('#timer-display');if(el){const total=Math.ceil(timerRemaining/1000);el.textContent=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');const b=$('#timer-toggle');b.textContent=timerRunning?'일시정지':timerRemaining===3600000?'시작':'계속';b.setAttribute('aria-label','수업 타이머 '+(timerRunning?'일시정지':'시작'))}}

'<section class="discovery-section" id="discovery-simplify"><div class="section-head"><div><div class="overline">02 / SIMPLIFY BEFORE AUTOMATING</div><h2>바로 만들지 말고, 이 순서로 물어봐요</h2><p>자동화하지 않기로 결정해도 좋은 분석 결과입니다.</p></div></div><div class="discovery-decisions">'+[['01','없애기','이 일, 꼭 필요한가요?','아무도 쓰지 않는 보고, 중복 관리대장이라면 없애는 것이 더 나을 수 있어요.'],['02','단순화하기','방식을 통일할 수 있나요?','제출 위치·양식·담당자·완료 기준을 먼저 정해요. 제각각인 입력을 해석하는 수고부터 줄여요.'],['03','기존 기능 쓰기','더 작은 해결책이 있나요?','Outlook 규칙, Excel 필터·조건부 서식, 원본 링크 공유나 기존 알림으로 충분한지 확인해요.'],['04','남은 부분 자동화','정해진 후속 작업이 있나요?','어떤 사건이 생기면, 일정한 기준으로 기록·안내하는 작은 부분을 Power Automate 후보로 골라요.']].map(r=>'<article class="card"><span class="feature-num">'+r[0]+' / '+r[1]+'</span><h3>'+r[2]+'</h3><p>'+r[3]+'</p></article>').join('')+'</div><div class="discovery-tip"><strong>“보고 업무”를 자동화하지 말고, 행동으로 쪼개요.</strong><p>대상 확인 → 안내 → 접수 → 현황 기록 → 누락 확인 → 재안내 → 내용 검토 → 최종 보고. 기록·확인·전달은 후보이고, 내용의 타당성과 예외 허용은 사람에게 남길 수 있어요.</p></div></section>'+
'<section class="discovery-section" id="discovery-case"><div class="section-head"><div><div class="overline">03 / A FICTIONAL WORKPLACE STORY</div><h2>월간 자료 취합, 어디까지만 자동화할까요?</h2><p>실제 회사 자료가 아닌 가상 사례입니다. 각 단계를 눌러 생각의 변화를 확인하세요.</p></div><span class="tag green">가상 사례</span></div><div class="discovery-story"><div class="discovery-case-nav" role="group" aria-label="가상 사례 단계">'+[['처음 요구','보고를 자동화하고 싶어요'],['불편 관찰','확인·중복·재안내가 문제예요'],['규칙 정리','도착과 검토 완료는 달라요'],['작은 시험','담당자에게 요약만 보여줘요']].map((r,i)=>'<button type="button" data-discovery-case="'+i+'" aria-pressed="'+(i===0)+'" class="'+(i===0?'active':'')+'"><small>STEP 0'+(i+1)+'</small><strong>'+r[0]+'</strong><span>'+r[1]+'</span></button>').join('')+'</div><div id="discovery-case-content" class="discovery-case-content" aria-live="polite"></div></div></section>'+
'<section class="discovery-section" id="discovery-judge"><div class="section-head"><div><div class="overline">04 / SHOULD WE TRY THIS FIRST?</div><h2>가능한 일과, 먼저 해볼 일은 달라요</h2><p>후보 하나를 떠올리고 답해 보세요. 점수가 아니라 보완할 조건을 찾는 도구입니다.</p></div></div><div class="discovery-judge-layout"><div class="card">'+DISCOVERY_QUESTIONS.map((r,i)=>'<div class="discovery-question"><label for="discovery-q-'+r[0]+'"><strong>0'+(i+1)+'. '+r[1]+'</strong><span>'+r[2]+'</span></label><select id="discovery-q-'+r[0]+'" data-discovery-question="'+r[0]+'"><option value="unknown">아직 모르겠어요</option><option value="yes">네, 확인했어요</option><option value="no">아니요</option></select></div>').join('')+'</div><aside id="discovery-verdict" class="discovery-verdict" aria-live="polite"></aside></div><p class="doc-date" style="margin-top:12px">교육용 자체 판단 도구입니다. 조직의 보안·법무·IT 검토나 실제 사용 권한 확인을 대신하지 않습니다. 답변은 저장되지 않습니다.</p></section>'+
'<section class="discovery-section"><div class="section-head"><div><div class="overline">MEASURE THE WORK LEFT FOR PEOPLE</div><h2>흐름 실행 횟수 말고, 남은 사람의 일을 봐요</h2></div></div><div class="grid cols2"><article class="article-card"><span class="tag blue">가상 계산 예시</span><h3>월 순절감 시간</h3><p class="discovery-formula">기존 작업 − 확인·예외처리 − 유지보수</p><dl class="discovery-metrics"><div><dt>기존: 월 80건 × 5분</dt><dd>400분</dd></div><div><dt>자동화 후 사람의 확인·예외처리</dt><dd>−80분</dd></div><div><dt>월 유지보수</dt><dd>−40분</dd></div><div><dt>월 순절감</dt><dd>280분</dd></div></dl><p>구축·시험 12시간이라면 시간 기준 회수 기간은 약 2.6개월입니다. 같은 조건이 유지된다는 가정이며, 추가 비용과 학습시간은 별도 포함해야 해요.</p></article><article class="article-card"><h3>함께 확인할 것</h3><ul><li>누락·중복·잘못된 알림이 줄었나요?</li><li>접수부터 완료까지 걸리는 시간이 줄었나요?</li><li>실패를 담당자가 알아차릴 수 있나요?</li><li>동료의 입력·확인 부담을 늘리지는 않았나요?</li></ul><p><strong>절약 시간은 곧바로 현금 절감을 뜻하지 않아요.</strong> 내 일이 10분 줄어도 동료 10명이 2분씩 더 입력하면 전체 업무는 늘어난 거예요.</p></article></div></section>'+
'<section class="discovery-section" id="discovery-canvas"><div class="section-head"><div><div class="overline">05 / YOUR FIRST SMALL PILOT</div><h2>내 업무 후보, 한 장으로 정리해요</h2><p>3~5일간 반복 행동을 관찰해 후보 3개를 찾고, 가장 명확하고 안전한 하나를 골라요.</p></div></div>'+notice('<strong>실제 회사 정보는 쓰지 마세요.</strong> 가상의 업무명·인물로 작성하세요. 입력은 서버로 전송되지 않으며, ‘브라우저에 저장’을 누를 때만 이 브라우저에 보관됩니다. 공용 PC에서는 저장하지 마세요.','warn')+'<div class="discovery-canvas card"><div class="grid cols2">'+DISCOVERY_FIELDS.map((r,i)=>'<div class="discovery-field"><label for="discovery-field-'+r[0]+'">'+String(i+1).padStart(2,'0')+' / '+r[1]+'</label><textarea id="discovery-field-'+r[0]+'" data-discovery-field="'+r[0]+'" rows="3" maxlength="1200" placeholder="'+r[2]+'"></textarea></div>').join('')+'</div><div class="buttons"><button class="btn primary" id="discovery-save">'+icon('check',14)+' 브라우저에 저장</button><button class="btn" id="discovery-export">'+icon('download',14)+' 메모 내려받기 (.md)</button><button class="btn ghost" id="discovery-clear">저장·입력 지우기</button></div><p class="doc-date" id="discovery-save-status" role="status">입력만으로는 저장되지 않습니다. 메뉴 이동 전 저장하거나 내려받으세요.</p></div><div class="grid cols2"><article class="article-card"><h3>작은 시험의 범위</h3><p>가상 자료 → 본인·교육용 대상 → 한 가지 규칙 → 짧은 기간으로 시작해요. 매주 일이라면 2~4주, 월간 일이라면 과거 가상 사례를 재현한 뒤 한 주기를 관찰할 수 있어요.</p><p>정상뿐 아니라 중복·누락·수정·권한 오류를 시험하고, 실패 알림과 수동 복귀 방법도 정해요.</p></article><article class="article-card"><h3>확대·중지 기준도 미리 정해요</h3><p><strong>확대 후보:</strong> 순절감이 있고, 예외 처리가 감당 가능하며, 중복·오발송과 실패를 추적할 수 있을 때.</p><p><strong>중지·재설계:</strong> 고위험 오처리, 반복 오류, 또는 확인·예외 처리 부담이 기존 업무를 잠식할 때. 이는 교육용 기준 제안이에요.</p></article></div><div class="discovery-tip"><strong>이번 1시간 교육에서는 5~10분만 써도 충분해요.</strong><p>반복 행동 하나 떠올리기 → 없애기·단순화 가능성 말하기 → 시작·조건·작업·예외 적기. 모든 칸을 완성하기보다 모르는 업무 규칙을 찾는 것이 목표예요.</p></div><div class="buttons"><a class="btn primary" href="#labs">작은 실습으로 이어가기 '+icon('arrow',14)+'</a><a class="btn" href="#lesson/business">업무 적용 전 체크리스트</a></div></section>'+
'<section class="article-card discovery-section"><div class="overline">SOURCES & BOUNDARIES</div><h2>공식 지침과 교육 제안을 구분해요</h2><h3>Microsoft 공식 문서에서 확인한 원칙</h3><ul><li>절차가 명확하고 반복적이며 오류가 나기 쉬운 작업을 우선하고, 투자 효과와 유지 부담을 함께 고려합니다.</li><li>사람의 판단이 필요한 단계는 남기고 다른 단계만 자동화할 수 있습니다. 적합한 기존 도구를 우선 검토합니다.</li><li>자동화 전후의 시간·비용·오류·처리량과 직원 경험 등 사업 가치를 측정합니다.</li></ul><div class="source-list"><a class="source-item" href="https://learn.microsoft.com/en-us/power-platform/well-architected/operational-excellence/automate-tasks" target="_blank" rel="noopener noreferrer">'+icon('external',13)+' Microsoft Learn · 자동화할 작업 선별과 운영</a><a class="source-item" href="https://learn.microsoft.com/en-us/power-platform/guidance/adoption/business-value" target="_blank" rel="noopener noreferrer">'+icon('external',13)+' Microsoft Learn · 비즈니스 가치 측정</a></div><h3>이 사이트가 구성한 교육 제안</h3><p>여섯 가지 발견 신호, 네 단계 개선 순서, 판단 도구, 가상 월간 취합 사례, 순절감 계산 예시와 파일럿 기준은 공식 인증·평가표가 아닌 자체 교육용 구성입니다.</p><p class="doc-date">Microsoft 365 E3 교육은 표준 커넥터 기반 클라우드 흐름을 다룹니다. 실제 연결·권한·조직 정책은 계정별 확인이 필요하며, 프리미엄 커넥터와 AI 기능은 기본 실습에 포함되지 않습니다. 실제 계정 연결·메일 발송·파일 업로드는 이 페이지에서 하지 않습니다.</p></section></div>'}
const DISCOVERY_CASES=[
['“월간 보고를 자동화하고 싶어요.”','업무 이름만으로는 무엇을 만들지 정할 수 없어요. 최근 실제 한 건에서 사람이 무엇을 했는지 따라가 봅니다.',['누구의 어떤 불편인가요?','어디에서 시간이 들고, 어떤 오류가 났나요?','업무 전체가 아니라 행동 하나를 고를 수 있나요?'],'첫 목표를 “보고서 자동 작성”으로 단정하지 않아요.'],
['힘든 것은 보고보다, 제출 현황 확인이었어요.','담당자가 메일과 폴더를 번갈아 보고, 수정본을 새 제출로 세고, 이미 낸 사람에게 재안내하는 상황을 가정해 봅니다.',['개선 목표: 현황 확인 시간 줄이기','품질 목표: 잘못된 재안내 줄이기','자동화 후보: 대상 목록과 접수 기록 비교'],'만들고 싶은 기능보다 줄이고 싶은 불편을 먼저 정의해요.'],
['파일 도착 ≠ 검토 완료 ≠ 최종 승인','제출 대상 목록과 접수 기록이 있어야 미제출을 비교할 수 있어요. 상태를 “완료” 하나로 합치면 잘못된 현황이 퍼질 수 있습니다.',['제출 구분: 대상 월 + 부서 등 고유 기준','수정본은 갱신할지, 별도 이력으로 남길지 결정','면제·마감 연장·누락 항목은 예외로 분리'],'내용의 타당성·면제 승인·최종 보고 의견은 사람이 판단해요.'],
['첫 시험은, 담당자에게 요약만 보여줘요.','가상 제출 대상과 접수 기록을 비교해 미제출로 보이는 대상·예외를 담당자에게 보여줍니다. 처음부터 대상자에게 직접 재촉 메일을 보내지 않아요.',['정상·중복·수정본·대상 월 누락 시험','제출 면제·마감 연장 대상의 잘못된 포함 확인','담당자가 수동 결과와 비교한 뒤 확대 판단'],'규칙이 안정되기 전에는 “자동 발송”보다 “검토할 결과 만들기”가 안전한 출발점이에요.']
];
function discoveryCase(index){const c=DISCOVERY_CASES[index];$('#discovery-case-content').innerHTML='<span class="tag blue">가상 사례 · STEP 0'+(index+1)+'</span><h3>'+c[0]+'</h3><p>'+c[1]+'</p><ul>'+c[2].map(t=>'<li>'+t+'</li>').join('')+'</ul><div class="discovery-case-note">'+c[3]+'</div>';document.querySelectorAll('[data-discovery-case]').forEach(b=>{const active=Number(b.dataset.discoveryCase)===index;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}
function discoveryVerdict(){const v={};document.querySelectorAll('[data-discovery-question]').forEach(s=>v[s.dataset.discoveryQuestion]=s.value);let title,body,tone='';if(v.safe==='no'||v.access==='no'){title='현재 범위의 실제 실행은 보류해요';body='위험 대응 또는 권한·정책 문제가 남아 있어요. 범위를 축소하거나 조직 담당자와 조건을 해결하세요. 가상 자료로 설계 연습은 할 수 있어요.';tone='warn'}else if(v.safe==='unknown'||v.access==='unknown'){title='안전·권한부터 확인해요';body='효과가 커 보여도 안전과 권한을 점수로 상쇄할 수 없어요. 실제 실행 전에 위험·복구 방법과 필요한 접근 권한을 확인하세요.'}else if(v.value==='no'){title='문제와 효과를 다시 골라봐요';body='자주 반복되는지, 누락·지연이 실제로 줄어드는지 관찰해 보세요. 기존 기능이나 업무 삭제가 더 나은 해결일 수 있어요.'}else if(v.owner!=='yes'){title='운영 담당자부터 정해요';body='만드는 것만으로 끝나지 않아요. 실패를 확인할 사람, 규칙·연결을 고칠 사람과 수동 복귀 방법을 정하세요.'}else if(v.rule!=='yes'||v.exception!=='yes'){title='업무 정리 또는 일부 자동화부터';body='입력 양식과 규칙을 정리하거나, 판단은 사람에게 남기고 수집·기록·전달만 작은 후보로 골라보세요.'}else if(v.value!=='yes'){title='기준이 될 효과를 기록해요';body='현재 소요시간·누락·지연 중 한 가지라도 측정하면 작은 시험 후 개선 여부를 비교할 수 있어요.'}else{title='작고 안전한 시험 후보예요';body='가상 자료·제한된 대상·한 가지 규칙으로 시험하세요. 정상과 예외 결과를 확인한 뒤 확대합니다. 이 결과는 운영 승인이나 성공 보장이 아니에요.';tone='ready'}$('#discovery-verdict').className='discovery-verdict '+tone;$('#discovery-verdict').innerHTML='<span class="tag '+(tone==='ready'?'green':'blue')+'">현재 답변으로 생각해 보기</span><h3>'+title+'</h3><p>'+body+'</p><div class="divider"></div><strong>사람에게 남길 결정</strong><p>금액·계약·인사·고객 약속·보안 권한처럼 영향이 큰 결정은 특히 신중하게 검토하세요. 자료 수집과 형식 확인만 자동화할 수도 있어요.</p>'}
function bindDiscovery(){if(!$('#discovery-case-content'))return;discoveryCase(0);discoveryVerdict();document.querySelectorAll('[data-discovery-case]').forEach(b=>b.addEventListener('click',()=>discoveryCase(Number(b.dataset.discoveryCase))));document.querySelectorAll('[data-discovery-question]').forEach(s=>s.addEventListener('change',discoveryVerdict));const key='flow-class-discovery-canvas-v1';let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(saved&&typeof saved==='object'){DISCOVERY_FIELDS.forEach(f=>{if(typeof saved[f[0]]==='string')$('#discovery-field-'+f[0]).value=saved[f[0]].slice(0,1200)});$('#discovery-save-status').textContent='이 브라우저에 저장했던 메모를 불러왔어요. 수정 후 다시 저장해 주세요.'}const values=()=>Object.fromEntries(DISCOVERY_FIELDS.map(f=>[f[0],$('#discovery-field-'+f[0]).value]));document.querySelectorAll('[data-discovery-field]').forEach(t=>t.addEventListener('input',()=>{$('#discovery-save-status').textContent='저장하지 않은 변경 내용이 있어요. 메뉴 이동 전 저장하거나 내려받으세요.'}));$('#discovery-save').addEventListener('click',()=>{try{localStorage.setItem(key,JSON.stringify(values()));$('#discovery-save-status').textContent='이 브라우저에 저장했어요. 계정 동기화나 서버 전송은 하지 않습니다.'}catch(e){$('#discovery-save-status').textContent='브라우저 저장을 사용할 수 없어요. 메모 내려받기를 이용해 주세요.'}});$('#discovery-clear').addEventListener('click',()=>{if(!confirm('입력한 업무 후보와 이 브라우저의 저장 메모를 지울까요?'))return;try{localStorage.removeItem(key)}catch(e){}document.querySelectorAll('[data-discovery-field]').forEach(t=>t.value='');$('#discovery-save-status').textContent='입력과 브라우저 저장 메모를 지웠어요.'});$('#discovery-export').addEventListener('click',()=>{const v=values();const text='# 자동화할 업무 찾기 · 내 업무 후보\n\n가상 자료로 작성하는 자체 교육용 메모입니다. 실제 운영 승인이나 권한 확인을 대신하지 않습니다.\n\n'+DISCOVERY_FIELDS.map(f=>'## '+f[1]+'\n\n'+(v[f[0]]||'(아직 작성하지 않음)')).join('\n\n')+'\n\n## 시험 전 확인\n- 정상·중복·누락·수정·권한 오류를 시험\n- 담당자·실패 알림·수동 복귀 방법 확인\n- 기존 시간과 확인·예외처리·유지 시간을 비교\n- 실제 회사 정보·개인정보·내부 링크는 제외\n';const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='automation-discovery.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('업무 후보 메모 다운로드를 요청했어요.')})}

setInterval(updateTimer,500);initShell();window.addEventListener('hashchange',()=>render());render();if(!storageAvailable)toast('브라우저의 로컬 진도 저장을 사용할 수 없어요. 학습 기능은 계속 이용할 수 있습니다.');

</script></body></html>
